<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body{
        align-items: center;
        justify-content: center;
        height: 100vh;
        display: flex;

    }
.kutu{
    width: 40px;
    padding: 10px;
    background: red;
    border: 3px solid green;
    outline-width:  3px ; /*kalınlık*/
    outline-style:solid ; /*şekli*/
    outline-color: blue; /*renk*/
    outline-offset: 5px; /*kutuya uzaklık*/
}
.kutu2{
    width: 40px;
    padding: 10px;
    background: blue;
    border: 3px solid green;
    outline:3px solid red; 
}
</style>
</head>
<body>
    
<div class="kutu"></div>
<div class="kutu2"></div>
    
</body>
</html>
