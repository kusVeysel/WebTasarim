<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit 3D Canvas Örneği</title>
    <style>
        body { margin: 0; }
        canvas { display: block; } /* Sayfa kenarlarındaki boşlukları sıfırlar */
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        // 1. Sahne (Scene) Oluşturma: Tüm 3D objelerin ve ışıkların bulunacağı alan
        const scene = new THREE.Scene();

        // 2. Kamera (Camera) Oluşturma: Bakış açısını belirler (Açı, Oran, Yakınlık, Uzaklık)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5; // Kamerayı Z ekseninde biraz geriye çekiyoruz

        // 3. Render Motoru (Renderer) Oluşturma: Sahneyi ekrana çizer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight); // Pencere boyutuna eşitle
        document.body.appendChild(renderer.domElement); // Canvas elementini HTML'e ekle

        // 4. Obje Oluşturma (Geometri + Materyal = Mesh)
        const geometry = new THREE.BoxGeometry(); // Küp geometrisi
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true }); // Yeşil renkli ve iskelet (wireframe) model materyal
        const cube = new THREE.Mesh(geometry, material); // Geometri ve materyali birleştir
        scene.add(cube); // Küpü sahneye ekle

        // 5. Animasyon Döngüsü (Animation Loop)
        function animate() {
            requestAnimationFrame(animate); // Tarayıcının yenileme hızına göre fonksiyonu sürekli çağır

            // Küpü her karede X ve Y eksenlerinde döndür
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Sahneyi kamera açısıyla ekrana çiz
            renderer.render(scene, camera);
        }

        // Animasyonu başlat
        animate();

        // Pencere boyutu değiştiğinde sahneyi yeniden boyutlandır
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
