<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="BOOTSTRAPLOCAL.CSS">
<style>
body{
    margin: 0;
    align-items: center;
    justify-content: center;
    height: 100vh;
    display: flex;
    background: black;
    font-family: sans-serif;    
}
.kutu{
    position:relative;
    width: 250px;
}
input{
    width: 100%;
    padding: 12px;
    background-color: transparent;
    border: 2px solid white;
    outline: none;
    color: white;
    font-size: 16px;
    border-radius: 8px;
}

label{
    position: absolute;
    left: 12px;
    top: 12px;
    color: white;
    pointer-events: none;
    transition: 0.3s ;
    background-color: black;
    padding: 0 5px;

}
input:focus+label
{
    top: -8px;
    font-size: 12px;
    color: green;

}
input:focus{
    border: 2px solid green;
}


</style>
</head>
<body>
    
    <div class="kutu ">
        <input type="text" required>
        <label>İsim </label>
    </div>

</body>
</html>
