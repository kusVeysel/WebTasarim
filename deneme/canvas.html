<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Etkileşimli 3D Canvas</title>
    <style>
        /* Sayfa kenarlıklarını sıfırlıyoruz ve kaydırma çubuklarını gizliyoruz */
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        /* Canvas'ın ekranı tam kaplamasını sağlıyoruz */
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <!-- Üç boyutlu grafik motoru olan Three.js kütüphanesini projeye dahil ediyoruz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. GLOBAL DEĞİŞKENLER VE KURULUM ---

        // Sahne, kamera, render motoru ve ana 3D nesnemiz için değişkenleri tanımlıyoruz
        let scene, camera, renderer, mesh;
        
        // Farenin koordinatlarını (-1 ile 1 arasında normalize edilmiş olarak) tutacak nesne
        const mouse = { x: 0, y: 0 };
        // Hedeflenen dönüş değerlerini yumuşak geçiş (lerp) için saklayacak nesne
        const targetRotation = { x: 0, y: 0 };

        // Tarayıcı penceresinin genişlik ve yükseklik değerlerini alıyoruz
        const width = window.innerWidth;
        const height = window.innerHeight;

        // --- 2. SAHNE BİLEŞENLERİNİN BAŞLATILMASI ---

        function init() {
            // Boş bir 3D uzay (sahne) oluşturuyoruz
            scene = new THREE.Scene();
            // Sahneye derinlik hissi katmak için siyah/gri tonlarında bir sis (fog) ekliyoruz
            scene.fog = new THREE.FogExp2(0x1a1a1a, 0.05);

            // Perspektif kamera oluşturuyoruz (Bakış Açısı, Oran, Yakınlık Planı, Uzaklık Planı)
            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            // Kamerayı Z ekseninde geriye çekerek nesneyi görebileceğimiz bir konuma getiriyoruz
            camera.position.z = 6;

            // WebGL tabanlı profesyonel render motorunu başlatıyoruz (Yumuşatma/Antialiasing aktif)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            // Çözünürlüğü ekranın piksel yoğunluğuna göre ayarlıyoruz (Retina/Yüksek DPI ekranlar için)
            renderer.setPixelRatio(window.devicePixelRatio);
            // Render alanının boyutunu tüm tarayıcı penceresi yapıyoruz
            renderer.setSize(width, height);
            // Gölge hesaplamalarını aktif hale getiriyoruz
            renderer.shadowMap.enabled = true;
            // HTML gövdesine (body) render motorunun ürettiği <canvas> elemanını bağlıyoruz
            document.body.appendChild(renderer.domElement);

            // Nesne, ışıklar ve olay yakalayıcıları başlatan alt fonksiyonları çağırıyoruz
            createGeometry();
            setupLights();
            setupEventListeners();
        }

        // --- 3. 3D NESNE VE MATERYAL TASARIMI ---

        function createGeometry() {
            // Profesyonel görünüm için standart bir küp yerine karmaşık bir "TorusKnot" (Düğüm) geometrisi seçiyoruz
            // Parametreler: (Yarıçap, Tüp Kalınlığı, Boru Segmenti, Enkesit Segmenti, P, Q kıvrımları)
            const geometry = new THREE.TorusKnotGeometry(1.2, 0.4, 120, 16);

            // Işığa, yansımalara ve gölgelere gerçekçi tepki veren profesyonel pürüzsüz materyal (MeshStandardMaterial)
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,       // Parlak turkuaz rengi
                roughness: 0.2,        // Pürüzsüzlük oranı (Düşük değer daha parlak/ayna gibi yapar)
                metalness: 0.5,        // Metalik hissi yansıtma oranı
                flatShading: false     // Yüzeylerin köşeli değil, tamamen yumuşak görünmesini sağlar
            });

            // Geometri ve materyali birleştirerek sahnede canlandırılabilir ana nesneyi (Mesh) oluşturuyoruz
            mesh = new THREE.Mesh(geometry, material);
            // Bu nesnenin üzerine düşen ışıklarla gölge üretmesini sağlıyoruz
            mesh.castShadow = true;
            // Bu nesnenin başka nesnelerin gölgelerini de üzerine alabilmesini sağlıyoruz
            mesh.receiveShadow = true;
            // Hazırlanan nesneyi 3D sahnemizin içine yerleştiriyoruz
            scene.add(mesh);
        }

        // --- 4. AYDINLATMA VE GÖLGE SİSTEMİ ---

        function setupLights() {
            // Sahnenin hiçbir yeri tamamen karanlık kalmasın diye düşük yoğunluklu ortam ışığı ekliyoruz
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // Güneş ışığı gibi belirli bir yönden gelen güçlü ve gölge üretebilen yönlü ışık ekliyoruz
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            // Işığın konumunu nesnenin sağ-üst-ön çaprazına yerleştiriyoruz
            directionalLight.position.set(5, 5, 4);
            // Bu ışık kaynağının gölge düşürme yeteneğini aktif ediyoruz
            directionalLight.castShadow = true;
            // Gölgelerin daha keskin ve yüksek kaliteli olması için gölge haritası boyutunu artırıyoruz
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Nesnenin arkasından vuran, derinlik hissini artıran renkli bir spot (nokta) ışık ekliyoruz
            const pointLight = new THREE.PointLight(0xff00ff, 0.6, 10);
            pointLight.position.set(-4, -3, -2);
            scene.add(pointLight);
        }

        // --- 5. FARE ETKİLEŞİMİ VE EVENT LISTENER'LAR ---

        function setupEventListeners() {
            // Fare hareket ettikçe çalışacak olan fonksiyonu tarayıcıya dinleyici olarak ekliyoruz
            window.addEventListener('mousemove', onMouseMove, false);
            // Tarayıcı penceresi yeniden boyutlandırıldığında canvas'ın bozulmaması için dinleyici ekliyoruz
            window.addEventListener('resize', onWindowResize, false);
        }

        // Fare hareket ettiğinde tetiklenen fonksiyon
        function onMouseMove(event) {
            // Farenin X pozisyonunu ekran ortasını 0 kabul edecek şekilde -1 ile 1 arasında normalize ediyoruz
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            // Farenin Y pozisyonunu normalize ediyoruz (Y ekseni webde ters olduğu için eksi ile çarpıyoruz)
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Farenin konumuna göre nesnenin dönmesi gereken hedef X ve Y açılarını hesaplıyoruz
            targetRotation.x = mouse.y * 1.5;
            targetRotation.y = mouse.x * 1.5;
        }

        // Pencere boyutu değiştiğinde sahneyi ekrana göre yeniden oranlayan fonksiyon
        function onWindowResize() {
            // Kameranın en/boy oranını yeni pencere boyutlarına göre güncelliyoruz
            camera.aspect = window.innerWidth / window.innerHeight;
            // Kamera projeksiyon matrisini değişikliklerin geçerli olması için yeniden hesaplıyoruz
            camera.updateProjectionMatrix();
            // Çizim motorunun boyutlarını yeni pencere boyutuna göre güncelliyoruz
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 6. ANİMASYON VE RENDER DÖNGÜSÜ ---

        function animate() {
            // Tarayıcının ekran yenileme hızına (60fps/144fps) senkronize olarak bu fonksiyonun sürekli çalışmasını sağlar
            requestAnimationFrame(animate);

            // --- LERP (Doğrusal Enterpolasyon) İLE YUMUŞAK HAREKET ---
            // Nesnenin aniden fareye dönmesi yerine, mevcut açısı ile hedef açı arasında %5'lik adımlarla yumuşak geçiş yapıyoruz
            mesh.rotation.x += (targetRotation.x - mesh.rotation.x) * 0.05;
            mesh.rotation.y += (targetRotation.y - mesh.rotation.y) * 0.05;

            // Nesne durağan kalmasın diye fare hareket etmese bile arka planda çok hafif kendi kendine dönmesini sağlıyoruz
            mesh.rotation.z += 0.005;

            // Güncellenmiş olan sahneyi ve kamerayı alarak ekrandaki canvas'a yeni kareyi çizer
            renderer.render(scene, camera);
        }

        // --- 7. SİSTEMİ BAŞLATMA ---

        // Tüm kurulum fonksiyonunu çalıştırarak bellekte 3D dünyayı kuruyoruz
        init();
        // Sonsuz döngüye sahip animasyon fonksiyonunu ilk kez çağırarak sistemi canlandırıyoruz
        animate();

    </script>
</body>
</html>
