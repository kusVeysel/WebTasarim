<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-black px-4 d-flex justify-content-between align-items-center">
  <span class="navbar-brand">SITE</span>

  <!-- FLEX MENU -->
  <div class="d-flex gap-3">
    <a href="#" class="nav-link text-light">Ana Sayfa</a>
    <a href="#" class="nav-link text-light">Hakkında</a>
    <a href="#" class="nav-link text-light">İletişim</a>
  </div>
</nav>

<!-- HERO -->
<div class="d-flex flex-column justify-content-center align-items-center text-center min-vh-100 px-3">

  <h1 class="display-3 mb-3">Hoşgeldin</h1>
  <p class="text-secondary mb-4">Flex + Utilities ile profesyonel layout</p>

  <button class="btn btn-primary">Başla</button>

</div>

<!-- CARDS -->
<div class="container my-5">

  <!-- FLEX GRID -->
  <div class="d-flex flex-wrap gap-4 justify-content-center">

    <!-- CARD -->
    <div class="card bg-dark text-light shadow" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Kart 1</h5>
        <p class="card-text">Flex ile hizalanmış kart.</p>
        <button class="btn btn-outline-primary w-100">Detay</button>
      </div>
    </div>

    <!-- CARD -->
    <div class="card bg-dark text-light shadow" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Kart 2</h5>
        <p class="card-text">Responsive yapı otomatik.</p>
        <button class="btn btn-outline-success w-100">Detay</button>
      </div>
    </div>

    <!-- CARD -->
    <div class="card bg-dark text-light shadow" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Kart 3</h5>
        <p class="card-text">Flex-wrap sayesinde alta iner.</p>
        <button class="btn btn-outline-danger w-100">Detay</button>
      </div>
    </div>

    <!-- CARD -->
    <div class="card bg-dark text-light shadow" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Kart 4</h5>
        <p class="card-text">Gap ile boşluk kontrolü.</p>
        <button class="btn btn-outline-warning w-100">Detay</button>
      </div>
    </div>

  </div>

</div>

<!-- FOOTER -->
<footer class="bg-black text-center py-3 mt-5">
  <p class="mb-0">© 2026 Site</p>
</footer>
<script src="BOOTSTRAPLOCAL.JS"></script>
</body>
</html>
<!-- 
h-100: parentin 100% olur
vh-100: ekranın 100% olur
min-vh-100: en az ekran yüksekliği kadar ol


-->
