<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <title>Card Full Example</title>
  </head>
  
  <body class="bg-light">
    
    <div class="container py-5">
      
      <!-- CARD: ana kutu -->
      <div class="card shadow border-0 rounded">
        
        <!-- CARD HEADER: üst bölüm -->
        <div class="card-header bg-dark text-white">
          <!-- card-header: üst bar -->
          <!-- bg-dark: arka plan siyah -->
          <!-- text-white: yazı beyaz -->
          Header Alanı
        </div>
        
        <!-- CARD IMAGE -->
        <img class="card-img-bottom" src="" alt="">
    <!-- card-img-top: resim üstte ve kart genişliğinde -->
    
    
    <!-- CARD BODY: içerik kısmı -->
    <div class="card-body p-3">
      <!-- card-body: iç alan -->
      <!-- p-3: padding (iç boşluk) -->
      
      <!-- CARD TITLE -->
      <h5 class="card-title fw-bold">
        <!-- card-title: başlık stili -->
        <!-- fw-bold: kalın yazı -->
        Kart Başlığı
      </h5>
      
      <!-- CARD TEXT -->
      <p class="card-text text-muted">
        <!-- card-text: normal açıklama metni -->
        <!-- text-muted: gri soluk yazı -->
        Bu bir açıklama yazısıdır.
      </p>
      
      <!-- SUBTITLE -->
      <small class="card-subtitle text-primary">
        <!-- card-subtitle: alt başlık -->
        Alt bilgi
      </small>
      
      <br><br>
      
      <!-- BUTTONS -->
      <button class="btn btn-primary btn-sm">
        <!-- btn: buton -->
        <!-- btn-primary: mavi stil -->
        <!-- btn-sm: küçük buton -->
        Beğen
      </button>
      
      <button class="btn btn-outline-dark btn-sm">
        <!-- btn-outline-dark: çerçeveli buton -->
        Yorum
      </button>

    </div>

    <!-- CARD FOOTER -->
    <div class="card-footer text-center bg-light">
      <!-- card-footer: alt bölüm -->
      <!-- text-center: ortalama -->
      <!-- bg-light: açık arka plan -->
      Footer Alanı
    </div>

  </div>

</div>

</body>
</html>
<!-- 
card: ana kutu
card-header: üst bölüm
card-footer: alt bölüm 
card-body: orta bölüm(içerik kısmı)
card-title: başlık
card-text: açıklama yazısı
card-subtitle: alt başlık
card-img-top : üste resim koyar 
card-img-bottom : alta resim koyar 

-->
