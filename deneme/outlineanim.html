<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            align-items:center;
            justify-content:center;
            height: 100vh;
            display: flex;
            background: black;
        }
.kutu{
    position: relative;
    border-radius:50%;
    width: 100px;
    height: 100px;
    outline:4px solid white;
    background-color: white;
    animation: anim 1s infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}
.kutu2{
    position: absolute;
    border-radius:50%;
    width: 100px;
    height: 100px;
    outline:4px solid white;
    background-color:transparent;
    animation: anim 1s infinite;
    animation-delay: 0.15s;
}
.kutu3{
    position: absolute;
    border-radius:50%;
    width: 100px;
    height: 100px;
    outline:4px solid white;
    background-color:transparent;
    animation: anim 1s infinite;
    animation-delay: 0.3s;
}
.kutu4{
    position: absolute;
    border-radius:50%;
    width: 100px;
    height: 100px;
    outline:4px solid white;
    background-color: transparent;
    animation: anim 1s infinite;
    animation-delay: 0.45s;
}
.kutu5{
    position: absolute;
    border-radius:50%;
    width: 100px;
    height: 100px;
    outline:4px solid white;
    background-color: transparent;
    animation: anim 1s infinite;
    animation-delay: 0.6s;
}
.kutu6{
    position: absolute;
    border-radius:50%;
    width: 100px;
    height: 100px;
    outline:4px solid white;
    background-color:transparent;
    animation: anim 1s infinite;
    animation-delay: 0.75s;
}
@keyframes anim{
    0%{outline-offset: 0px;}
    100%{outline-offset: 150px; 
  outline-color:transparent ;
    }
}

    </style>
</head>
<body>
    <div class="kutu">
        <span id="harf-alani"></span>
        <div class="kutu2"></div>
        <div class="kutu3"></div>
        <div class="kutu4"></div>
        <div class="kutu5"></div>
        <div class="kutu6"></div>
        
    </div>

<script>
    const harfAlani = document.getElementById("harf-alani");
    const degiskenler = ['a','b','c','d','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z'];
    
    setInterval(() => {
        harfAlani.innerText = degiskenler[Math.floor(Math.random() * degiskenler.length)]; 
    }, 420);

</script>
</body>
</html>
