<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* 🔥 hover efekti */
.card-hover {
  transition: all 0.3s ease;
}
.card-hover:hover {
  transform: scale(1.05);
}

/* 🔥 resim sabitleme */
.card-img-custom {
  height: 200px;
  object-fit: cover;
}

/* 🔥 overlay yazı */
.image-overlay {
  position: absolute;
  bottom: 10px;
  left: 10px;
  color: white;
}
</style>
</head>

<body class="bg-dark text-light">

<div class="container py-5">

  <div class="row g-4">

    <!-- CARD -->
    <div class="col-md-6 col-lg-4 col-xl-3">
      <div class="card bg-dark text-light border-0 shadow card-hover h-100 position-relative">

        <!-- BADGE -->
        <span class="badge bg-danger position-absolute top-0 start-0 m-2">YENİ</span>

        <!-- IMAGE -->
        <div class="position-relative">
          <img src="https://picsum.photos/300/200" class="card-img-top card-img-custom">

          <!-- OVERLAY -->
          <div class="image-overlay">
            <small>Özel içerik</small>
          </div>
        </div>

        <!-- BODY -->
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Ürün 1</h5>
          <p class="card-text text-secondary">
            Bu kart tamamen profesyonel yapı ile oluşturuldu.
          </p>

          <!-- BUTONU AŞAĞI SABİTLE -->
          <button class="btn btn-outline-primary mt-auto w-100">Satın Al</button>
        </div>

      </div>
    </div>

    <!-- CARD 2 -->
    <div class="col-md-6 col-lg-4 col-xl-3">
      <div class="card bg-dark text-light border-0 shadow card-hover h-100 position-relative">

        <span class="badge bg-success position-absolute top-0 start-0 m-2">İNDİRİM</span>

        <div class="position-relative">
          <img src="https://picsum.photos/301/200" class="card-img-top card-img-custom">
          <div class="image-overlay">
            <small>%30 OFF</small>
          </div>
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Ürün 2</h5>
          <p class="card-text text-secondary">
            Hover, badge, overlay hepsi aktif.
          </p>

          <button class="btn btn-outline-success mt-auto w-100">Satın Al</button>
        </div>

      </div>
    </div>

    <!-- CARD 3 -->
    <div class="col-md-6 col-lg-4 col-xl-3">
      <div class="card bg-dark text-light border-0 shadow card-hover h-100 position-relative">

        <span class="badge bg-warning text-dark position-absolute top-0 start-0 m-2">POPÜLER</span>

        <div class="position-relative">
          <img src="https://picsum.photos/302/200" class="card-img-top card-img-custom">
          <div class="image-overlay">
            <small>Trend</small>
          </div>
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Ürün 3</h5>
          <p class="card-text text-secondary">
            Responsive grid ile dizildi.
          </p>

          <button class="btn btn-outline-warning mt-auto w-100">Satın Al</button>
        </div>

      </div>
    </div>

    <!-- CARD 4 -->
    <div class="col-md-6 col-lg-4 col-xl-3">
      <div class="card bg-dark text-light border-0 shadow card-hover h-100 position-relative">

        <span class="badge bg-info position-absolute top-0 start-0 m-2">YENİ</span>

        <div class="position-relative">
          <img src="https://picsum.photos/303/200" class="card-img-top card-img-custom">
          <div class="image-overlay">
            <small>Premium</small>
          </div>
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Ürün 4</h5>
          <p class="card-text text-secondary">
            Equal height + flex column sistemi.
          </p>

          <button class="btn btn-outline-info mt-auto w-100">Satın Al</button>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
