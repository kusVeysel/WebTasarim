<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Dropdown</title>
    <link href="../CDN/BootstrapCDN.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f4f5f7;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: #1e293b;
            color: white;
            position: fixed;
        }

        .sidebar .nav-link {
            color: #cbd5e1;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar .nav-link:hover {
            background: #334155;
            color: white;
        }

        .submenu {
            list-style: none;
            padding: 0;
            background: #0f172a;
        }

        .submenu li a {
            color: #94a3b8;
            padding: 10px 20px 10px 45px;
            display: block;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .submenu li a:hover {
            color: white;
        }

        .nav-link[aria-expanded="true"] .arrow {
            transform: rotate(90deg);
        }

        .arrow {
            transition: transform 0.3s;
        }
    </style>
</head>

<body>


    <div class="sidebar">
        <div class="p-4 mb-2 text-center border-bottom border-secondary">
            <h5 class="m-0">Modern Admin</h5>
        </div>

        <nav class="nav flex-column">
            <a href="#" class="nav-link">
                <span><i class="fas fa-home me-2"></i> Dashboard</span>
            </a>

            <a href="#chartsMenu" class="nav-link" data-bs-toggle="collapse" role="button" aria-expanded="false">
                <span><i class="fas fa-chart-pie me-2"></i> Charts</span>
                <i class="fas fa-chevron-right arrow ms-auto small"></i>
            </a>
            <div class="collapse" id="chartsMenu">
                <ul class="submenu">
                    <li><a href="#">D3 Charts</a></li>
                    <li><a href="#">C3 Charts</a></li>
                    <li><a href="#">Morris Charts</a></li>
                </ul>
            </div>

            <a href="#mapsMenu" class="nav-link" data-bs-toggle="collapse" role="button" aria-expanded="false">
                <span><i class="fas fa-map-marker-alt me-2"></i> Maps</span>
                <i class="fas fa-chevron-right arrow ms-auto small"></i>
            </a>
            <div class="collapse" id="mapsMenu">
                <ul class="submenu">
                    <li><a href="#">Google Maps</a></li>
                    <li><a href="#">Vector Maps</a></li>
                </ul>
            </div>

            <a href="#" class="nav-link">
                <span><i class="fas fa-file-alt me-2"></i> Documentation</span>
            </a>
        </nav>
    </div>

    <script src="../CDN/BootstrapCDN.js"></script>
</body>

</html>
