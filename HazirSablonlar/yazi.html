<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazı Hover Efekti</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .hover-yazi {
            font-size: 5rem;
            font-weight: 800;
            text-transform: uppercase;
            /* Büyük harfe çevirir */
            cursor: pointer;

            /* Gradyan Arka Plan: Yarısı mavi, yarısı siyah */
            background: linear-gradient(to right, #007bff 50%, #333 50%);

            /* Arka planı yazının içine hapsediyoruz */
            background-size: 200% 100%;
            /*Arka plan boyutunu x 2 katına , y 1 katına çıkar*/
            background-position: 100% 0;
            /*Arka plan konumu x 100% sağa gelir y 0% gelir*/
            background-clip: text;
            -webkit-text-fill-color: transparent;

            /* Geçiş efekti */
            transition: background-position 0.5s ease-in-out;

        }

        @keyframes gradient {
            0% {
                background-position: 100% 0;
            }

            50% {
                background-position: 0 0;
            }
        }

        .hover-yazi:hover {
            background-position: 0 0;
        }
    </style>
</head>

<body>

    <div class="hover-yazi">
        Merhaba
    </div>

</body>

</html>
