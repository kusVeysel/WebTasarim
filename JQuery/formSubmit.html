<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <from id="from1">
        <input type="text" id="isim">
        <button type="submit">Gönder</button>
    </from>



    <script>
        $(function(){
            $("#from1").click(function(e){
                e.preventDefault();//sayfayı yenilenmeyi engeller
                var isim=$("#isim").val();
                if(isim.trim()===""){
                    alert("isim giriniz");
                    return;
                }
                else{
                    alert("Gönderildi: "+isim);
                }
            })
            
        })


    </script>
</body>
</html>
