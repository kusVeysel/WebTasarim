<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../CDN/JqueryCDN.JS"></script>
</head>

<body>

    <button id="slide">slide</button> <br> <br>
    <div id="kutu" style="width: 500px;background-color: orange;">İçerik</div>


    <script>
        $(function () {
            $("#slide").click(function () {
                $("#kutu").slideToggle();
            })
        })

    </script>
</body>

</html>
