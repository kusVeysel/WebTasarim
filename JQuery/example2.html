<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<style>
    #kutu{
        width: 200px;
        height: 200px;
        background: red;
    }
</style>
<body>
    
    <button id="gizli">gizle</button>
    <button id="göster">göster</button>
    <div id="kutu"></div>
    <script>
        $(document).ready(function(){
            $("#gizli").click(function(){
                $("#kutu").hide(); //gizle
            })
        })
        $(document).ready(function(){
            $("#göster").click(function(){
                $("#kutu").show(); //göster
            })
        })

 </script>
</body> 
</html>
