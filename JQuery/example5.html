<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    
<button id="ekle"></button>
<div id="alan"></div>

    <script>
        $(function(){
            $("#ekle").click(function(){
                $("#alan").append("<button class='dinamik'>Yeni Buton</button>");
            });
            $(document).on("click",".dinamik")(function(){
                alert("Dinamik buton tıklandı");
            });
        })



    </script>
</body>
</html>
