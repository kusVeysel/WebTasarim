     <script>
         var allUsers=[];
         $("#btnGetir").click(function(){
             $("#loading").show();
             $("#noResult").hide();
             $.get("https://jsonplaceholder.typicode.com/users",function(users){    
              
                allUsers=users;
                listeyiBas(users);
                $("#loading").hide();
             });
          
         });
         $("#search").on("keyup",function(){
           
            var kelime =$(this).val().toLowerCase(); //nancy
            var filtre=[];
            allUsers.forEach(function(u){  /// tek tek baktı 
              
                if(u.name.toLowerCase().indexOf(kelime)>-1){ //sonuc var ise yani -1 den buyukse 
                    filtre.push(u); // filtrenin içerisine attı 
                }
            
                });
                 if(filtre.length>0){ //filtre >0  
                    $("#noResult").hide(); // ggizlicem
                    listeyiBas(filtre); // gelen datayıda buraya basacam 
                 }
                 else{
                    $("#list").empty();
                    $("#noResult").show();
                 }
            });
 
         function listeyiBas(users){
            $("#list").empty();
            users.forEach(function(u){
                  $("#list").append("<li>"+u.name+" - "+u.email+  "</li>");
            }); 
            };
     </script>
</body>
