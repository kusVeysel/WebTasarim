<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div class="kart">
        <h3>Başlık</h3>
        <p class="aciklama">Açıklama Metni</p>
        <button class="detay-btn">Detay</button>
    </div>

    <div class="kart">
        <h3>Başlık 2</h3>
        <p class="aciklama">Açıklama Metni 2</p>
        <button class="detay-btn">Detay</button>
    </div>


    <script>
//find: seçilen elementin içined  armana yapmaktadır
$('.kart').find("p");
$('.kart').find(".aciklama");
$('.kart').find("button");
$('.kart').find(".aciklama").addClass(".kart");
$('.kart').find(".aciklama").text("bir şeyler denedik");

$('.kart').find(".aciklama").css("background-color","red");

    </script>

</body>
</html>
