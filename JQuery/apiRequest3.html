            <p>Telefonu olan Kullanıcılar</p>
        </div>
    </div>

    <script>
        /*
                    gmail.com :1 +1         5
                    biz.com :2 +1     3
                    yahoo.com:3 +1        2
                
                */
        $("#btnGetir").click(function () {

            $.ajax({
                url: "https://jsonplaceholder.typicode.com/users",
                type: "GET",
                beforeSend: function () {
                    $("#loading").show();
                },
                success: function (users) {

                    //toplam kullanıcı 
                    $("#totolUsers").text(users.length);// her bir kullanıcıyı saydırdık .

                    var compaines = users.map(u => u.company.name);
                    var uniqueCompaines = [...new Set(compaines)];
                    $("#totalCompaines").text(uniqueCompaines.length);

                    var domainCount = {};
                    users.forEach(function (u) {
                        var domain = u.email.split("@")[1];
                        domainCount[domain] = (domainCount[domain] || 0) + 1;
                    });
                    var topDomain = Object.keys(domainCount)
                        .reduce(function (a, b) {  //reduce : karsılastır object.keys domain isimleri
                            return domainCount[a] > domainCount[b] ? a : b;
                        });
                    $(".totalDomain").text(topDomain);

                    var phoneUsers = users.filter(u => u.phone && u.phone.length > 0);
                    $(".phoneCount").text(phoneUsers.length);

                },
                err: function () {
                    alert("Dashboard Yüklenmedi");
                },
                complete: function () {
                    $("#loading").hide();
                }
            })
        });
    </script>
