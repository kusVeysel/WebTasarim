    <div class="modal fade" id="exampleModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="card-title">
                        <span id="modalTitle"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <div class="text-center mt-3">
                        <img src="" alt="" id="modalImg" class="img-fluid" style="max-height: 250px;">
                    </div>
                    <p class="card-text text-info text-break px-3 mb-3">
                        <span id="modalText"></span>

                <div class="modal-footer mt-3">

                </div>
            </div>
        </div>
    </div>
    <script src="../CDN/BootstrapCDN.js"></script>
    <script>

        const modalMain = document.getElementById('exampleModal');
        if (modalMain) {
            modalMain.addEventListener('show.bs.modal', event => {
                const button = event.relatedTarget;
                const title = button.getAttribute('data-title');
                const text = button.getAttribute('data-text');
                const img = button.getAttribute('data-img');

                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalText').innerText = text;
                document.getElementById('modalImg').src = img;
            });
        }

    </script>
