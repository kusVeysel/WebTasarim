    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!---
        Bootstrap: hazır css sınıfları ve bazı javascript bileşenlerinin sıkıstırılmıs halidir. 
        Projeye dısardan ekliyoruz ve daha sonrasında bunu kullanıyoruz
      
        <meta name="viewport" content="width=device-width, initial-scale=1.0">: ortama gore değişkenlik gösterip ilgili ortamı yakalayıp ona göre davranmaktadır. tamamen responsive tasarımlar icin kullanılmaktadır. 
         
        ,bootstrap sıkıstırılmıs css biz bunu projemize 2 yol ile entegre edebilir 1 url olarak cagırmak 2 projeye yuklemek
        htmlde bootstrap tag kullanmak icin class içerisne yazıyorsunuz 
 <div class="spinner-border"></div>
   


     Bootstrap ana temel fikri nedir ?
     Bootstrap sayfayı düzgün hizalamak icin bir ana kutu önerir. 
     container => ortalı kenarlarda boslusluklu responsive bir ana alan 
     container-fluid => tam ekran genişligini kullanmaktadır. 
    
    -->
<!--        
     <div class="container">
        içerik burada olacak 
     </div>
   <div class="container-fluid">
        içerik burada olacak 
     </div>  -->
       <div class="container">
           <div class="row">
             <div class="col">A</div>
             <div class="col">B</div>
             <div class="col">C</div>
           </div>
       </div>
 <!---
      ROW=> satır 
      col=> sutun eşit parçalara bolduk 
      ekran kuculunce kolonlar otomatik davranır responsive geregi 
      Grid sistemi 
      grid sayfayı kolonlara bolme sistemidir. 
      bootstrapte sayfa 12 parçaya bolunur 
      bootstrap grid = container+row+col
    container : sayfayı ortalar, kenarlardan bosluk bırakır ve responsive calısır 
    row: kolonları aynı satıra dizer 
    alt alta gelmesini engeller. 
 -->
      <div class="row">
        <div class="col-6">A</div>
        <div class="col-6">B</div>
      </div>
          <div class="row">
        <div class="col-4">A</div>
        <div class="col-4">B</div>
        <div class="col-4">C</div>
      </div>

   <div class="container">
    <div class="row">
        <div class="col-3">A</div>
        <div class="col-3">B</div>
        <div class="col-3">C</div>
      </div>
   </div>
        
   <div class="container-fluid">
    <div class="row">
        <div class="col-3">A</div>
        <div class="col-3">B</div>
        <div class="col-3">C</div>
      </div>
   </div>
      
   <div class="container-fluid bg-dark text-white">
      
      <div class="container">
        Ben ortadayım ama kenarlarda bosluk yok 
      </div>
  </div>
  <div class="container bg-dark text-white">
    içerik burada olacak 
  </div>
     <!--
        
     tam ekran arka plan istiyorsam container-fluid
     içerigi ortalamak istiyorsam içine container koyarım
