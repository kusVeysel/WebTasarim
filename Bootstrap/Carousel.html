                <h3>Başlık1</h3>
                <p>paragraf1</p>
            </div>
            <div class="carousel-item">
                <h3>Başlık2</h3>
                <p>paragraf2</p>
            </div>
            <div class="carousel-item">
                <h3>Başlık3</h3>
                <p>paragraf3</p>
            </div>
            <div class="carousel-item">
                <h3>Başlık4</h3>
                <p>paragraf4</p>
            </div>
            <div class="carousel-item">
                <h3>Başlık5</h3>

            </div>
            <div class="carousel-item">
                <h3>Başlık6</h3>

        <button class="carousel-control-prev" type="button" data-bs-target="#ana" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#ana" data-bs-slide="next">

    <script src="../CDN/BootstrapCDN.js"></script>

</html>
<!-- 
carousel: ana class
carousel-item: her bir slayt
slide:carouselin yumuşak geçişi sağlar
carousel-control-prev-icon: < butonu
carousel-control-next-icon: > butonu
data-bs-slide="(prev:geri ya da next:ileri)": Hangi yöne aksın ,JS Bootstrapidir 
carousel-control-next,carousel-control-prev: < > butonlarına konum hover vs. verir
carousel-inner: slayt gösterisini bir arada tutar
data-bs-ride="carousel":ana kutuya ekleyerek slaytın otomatik akmasını sağlar,JS Bootstrapidir
Bootstrap'te data-bs-ride özniteliği (attribute), bir Carousel (Slayt) bileşeninin otomatik olarak dönmeye başlayıp başlamayacağını ve ne zaman başlayacağını belirleyen bir tetikleyicidir
data-bs-interval="3000"ana kutuya ekleyerek slaytın hangi aralıklarla otomatik akacağını söyler,JS Bootstrapidir

-->
