<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Dropdown Örnekleri</title>

    <link href="../CDN/BootstrapCDN.css" rel="stylesheet">

    <style>
        .hover-dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <h2 class="mb-4">Bootstrap Dropdown Çeşitleri</h2>

        <div class="mb-5">
            <h5>1. Standart (Tıklama ile)</h5>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    Seçenekler
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Profil</a></li>
                    <li><a class="dropdown-item" href="#">Ayarlar</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#">Çıkış Yap</a></li>
                </ul>
            </div>
        </div>

        <div class="mb-5">
            <h5>2. Hover (Üzerine Gelince Açılan)</h5>
            <div class="dropdown hover-dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button">
                    Kategoriler
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Elektronik</a></li>
                    <li><a class="dropdown-item" href="#">Moda</a></li>
                    <li><a class="dropdown-item" href="#">Kitap</a></li>
                </ul>
            </div>
        </div>

        <div class="mb-5">
            <h5>3. Split Button (Bölünmüş Buton)</h5>
            <div class="btn-group">
                <button type="button" class="btn btn-danger">Ana İşlem</button>
                <button type="button" class="btn btn-danger dropdown-toggle dropdown-toggle-split"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="visually-hidden">Menü</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Düzenle</a></li>
                    <li><a class="dropdown-item" href="#">Sil</a></li>
                </ul>
            </div>
        </div>

    </div>

    <script src="../CDN/BootstrapCDN.js"></script>

</body>

</html>
