<body>

    <div class="container py-5">

        </div>

<br><br><br><br>

<div class="container py-5 bg-info rounded-4 shadow-lg">
    <form class="form">
        <label class="form-label">Ad</label>
        <input class="form-control mb-3" type="text">
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email">
        <label class="form-label">Şifre</label>
        <input class="form-control mb-3" type="password">
        <label class="form-label">Şehir</label>
        <select class="form-select">
            <option value="a">a</option>
            <option value="b" selected>b</option>
            <option value="c">c</option>
        </select>
        <div class="form-check mt-2 ms-3">
            <input class="form-check-input" type="checkbox">

</div>

<br><br><br><br>


<nav class="navbar navbar-expand-lg bg-dark navbar-dark px-3">
    <a class="navbar-brand" href="#">site</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
            <li>
                <a class="nav-link active" href="#">ana sayfa</a>

    </div>
</nav>

<br><br><br><br>

<div class="container">
    <div class="text-center table-hover bg-dark rounded-3">
    <table class="table table-responsive table-bordered table-hover ">
        <thead class="table-info">
            <tr>
                <th>id</th>
                <th>ad</th>
                <th>soyad</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            <tr class="table-success">
                <th>1</th>
                <td>ahmet</td>
                <td>yılmaz</td>
            </tr>
            <tr class="table-danger">
                <th>2</th>
                <td>ayşe</td>
                <td>demir</td>
            </tr>
            <tr class="table-warning">

        </tbody>

    </table>

</div>

<br><br><br><br>

<button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#Modal">
Modalı Aç
</button>
<div class="modal fade" id="Modal">
    <div class="modal-dialog">
        <div class="modal-content bg-warning ">

            <div class="modal-header">
                <h1 class="modal-title">Başlık</h1>
                    <button class="btn-close mb-3 bg-danger" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h3>İçerik burada</h3>
            </div>

            <div class="modal-footer ">
                <h5 class="me-auto">footer alanı</h5>
                <button class="btn btn-primary" data-bs-dismiss="modal">Kapat</button>
            </div>

        </div>
    </div>
</div>

<br><br><br>

<button class="btn btn-info" id="toastBtn">Toast geh bili bili</button>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div class="toast" id="Toast">
            <div class="toast-header">
                <strong class="me-auto">Sistem</strong>
                <button class="btn-close" data-bs-dismiss="toast"></button>
            </div> 
            <div class="toast-body">
                Toast içeriği burada yer alır.
            </div>
        </div>
    </div>
<br><br><br><br>

<div class="carousel bg-black text-warning text-center slide align-items-center d-flex" data-bs-ride="carousel" data-bs-interval="3000" id="ana" style="height: 300px;">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <h3>1.Slayt</h3>
        </div>
        <div class="carousel-item">
            <h3>2.Slayt</h3>
        </div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#ana" data-bs-slide="prev" type="button" >
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#ana" data-bs-slide="next" type="button">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>
<br><br><br>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const toastBtn = document.getElementById('toastBtn');
    const toastEl = document.getElementById('Toast');
    if(toastBtn && toastEl){
        toastBtn.addEventListener('click', () => {
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        });
    }
</script>
</body>
</html>
<!--

1-5 arasıdır

Responsive

-----NAVBAR-----

YAPISI
modal -> modal-dialog -> modal-content -> modal-header / modal-body 
/ modal-footer

az da manuel js yazmak gerekir

-----CAROUSEL-----
carousel: ana class
carousel-item: her bir slayt
slide:carouselin yumuşak geçişi sağlar
carousel-control-prev-icon: < butonu
carousel-control-next-icon: > butonu
data-bs-slide="(prev:geri ya da next:ileri)": Hangi yöne aksın ,JS Bootstrapidir 
carousel-control-next,carousel-control-prev: < > butonlarına konum hover vs. verir

data-bs-interval="3000"ana kutuya ekleyerek slaytın hangi aralıklarla otomatik akacağını söyler,JS Bootstrapidir

-----ACCORDİON-----
accordion: en dıştaki kapsayıcıdır ,ana class

accordion-collapse: Gizlenen ve açılan asıl paneldir
accordion-body: Panelin içindeki gerçek metin veya görsel içeriğin bulunduğu yerdir
show: açık olarak gelir(accordion-collapse içinde kullanılan class)
