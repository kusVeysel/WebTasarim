<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="../CDN/BootstrapCDN.css" rel="stylesheet">

  <title>Form Example</title>
</head>

<body class="bg-light">

  <div class="container mt-5">

    <!-- FORM: tüm inputları saran yapı -->
    <form class="p-4 border rounded shadow-sm bg-white">

      <!-- FORM LABEL -->
      <label class="form-label">
        <!-- form-label: label görünümünü düzenler -->
        Ad
      </label>

      <!-- INPUT -->
      <input type="text" class="form-control mb-3">
      <!-- form-control: inputu modern yapar -->
      <!-- mb-3: alt boşluk -->

      <!-- EMAIL LABEL -->
      <label class="form-label">
        Email
      </label>

      <!-- EMAIL INPUT -->
      <input type="email" class="form-control mb-3">
      <!-- email input: email formatı bekler -->

      <!-- PASSWORD LABEL -->
      <label class="form-label">
        Şifre
      </label>

      <!-- PASSWORD INPUT -->
      <input type="password" class="form-control mb-3">
      <!-- password: yazıyı gizler -->

      <!-- SELECT LABEL -->
      <label class="form-label">
        Şehir
      </label>

      <!-- SELECT BOX -->
      <select class="form-select mb-3">
        <!-- form-select: dropdown stil -->
        <option>İstanbul</option>
        <option>Ankara</option>
        <option>İzmir</option>
      </select>

      <!-- CHECKBOX AREA -->
      <div class="form-check mb-3">
        <!-- form-check: checkbox container -->

        <input class="form-check-input" type="checkbox">
        <!-- form-check-input: checkbox stil -->

        <label class="form-check-label">
          <!-- form-check-label: checkbox yazısı -->
          Beni hatırla
        </label>
      </div>

      <!-- BUTTON -->
      <button class="btn btn-primary w-100">
        <!-- btn: buton -->
        <!-- btn-primary: mavi stil -->
        <!-- w-100: full genişlik -->
        Gönder
      </button>

    </form>

  </div>

</body>

</html>
<!-- 
form-control: inputu modern yapar ,focus vs.
from-label: margin-bottom(alttan dış boşluk atar)
form-select: dropdown stil
from-check: checkbox containeri
form-check-label: checkbox etiketi
form-check-input: checkbox stili

-->
