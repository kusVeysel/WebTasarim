<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CDN/BootstrapCDN.css">
</head>

<body>
    <div class="accordion" id="Ana">
        <div class="accordion-item">
            <h3 class="accordion-header">
                <button class="accordion-button " type="button" data-bs-toggle="collapse"
                    data-bs-target="#accor">yok</button>
            </h3>
            <div id="accor" class="accordion-collapse collapse" data-bs-parent="#Ana">
                <div class="accordion-body">Merhaba</div>
            </div>
            <div id="accor" class="accordion-collapse collapse" data-bs-parent="#Ana">
                <div class="accordion-body">Merhaba</div>
            </div>
        </div>

        <div class="accordion-item">
            <h3 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#accorr">yok</button>
            </h3>
            <div id="accorr" class="accordion-collapse collapse" data-bs-parent="#Ana">
                <div class="accordion-body">Merhaba</div>
            </div>
        </div>

    </div>


    <script src="../CDN/BootstrapCDN.js"></script>
</body>

</html>
<!-- 
accordion: en dıştaki kapsayıcıdır ,ana class
accordion-item: Her bir maddeyi temsil eder, her bir öge(açılıp kapanabilen)
accordion-header: Başlık kısmıdır, içinde genellikle bir buton barındırır
accordion-button: Kullanıcının tıkladığı tetikleyicidir. data-bs-toggle="collapse" ve data-bs-target özniteliklerini içerir
accordion-collapse: Gizlenen ve açılan asıl paneldir
accordion-body: Panelin içindeki gerçek metin veya görsel içeriğin bulunduğu yerdir
show: açık olarak gelir(accordion-collapse içinde kullanılan class)

-->
