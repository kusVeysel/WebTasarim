<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="../deneme/BOOTSTRAPLOCAL.CSS" rel="stylesheet">
<title>Navbar Menü</title>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark px-3">
<!-- navbar: temel yapı -->
<!-- navbar-expand-lg: büyük ekranda açılır, küçükte collapse olur -->
<!-- bg-dark: arka plan -->
<!-- navbar-dark: yazıları beyaz yapar -->
<!-- px-3: sağ-sol boşluk -->

  <!-- LOGO -->
  <a class="navbar-brand" href="#">
    <!-- navbar-brand: logo / site adı -->
    Navbar Menü
  </a>  

  <!-- HAMBURGER BUTTON (mobilde açılır menü) -->
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    <!-- navbar-toggler: açılır buton -->
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- MENU -->
  <div class="collapse navbar-collapse" id="menu">
  <!-- collapse: gizlenebilir alan -->
  <!-- navbar-collapse: navbar için özel collapse -->

    <!-- MENU LIST -->
    <ul class="navbar-nav ms-auto">
        <!-- navbar-nav: menu container -->
        <!-- ms-auto: sağa yaslar -->
        
        <li class="nav-item">
          <a class="nav-link active" href="#">
            <!-- nav-link: menu link -->
            <!-- active: aktif sayfa -->
            Ana Sayfa
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            Hakkında
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            İletişim
          </a>
        </li>
    </ul>

    <!-- SEARCH -->
    <form class="d-flex ms-3">
      <!-- d-flex: yatay hizalama -->
      <!-- ms-3: sol boşluk -->

      <input class="form-control me-2" type="search" placeholder="Ara">
      <!-- form-control: input stil -->
      <!-- me-2: sağ boşluk -->

      <button class="btn btn-outline-light">
        Ara
      </button>
    </form>

  </div>

</nav>

<!-- BOOTSTRAP JS (collapse çalışması için şart) -->
<script src="../deneme/BOOTSTRAPLOCAL.JS"></script>

</body>
</html>
<!-- 
navbar: temel yapı
navbar-expand-lg: büyük ekranda açılır, küçükte collapse olur 
navbar-dark: yazıyı beyaz yapar
navbar-brand: logo/site adı
navbar-toggler-icon: alt alta 3 çigi şeklinde ikon oluşturur 
data-bs-toggle="collapse" :js'nin bootstrap özelliğidir ,bir şeyin açıp kapanacağını söyler 
data-bs-toggle="": ne tür davranış ,js bootstrapi
data-bs-target="#menu": açıp kapatılacak şey bu ,olduğunu söyler html ; bu ID'li tagı gidip bulur
data-bs-target="": hangi eleman ,js bootstrapi
navbar-toggler: açılır buton
navbar-nav: menü containeri
nav-item: menü içindeki eleman
nav-link: menü link
collapse: gizlenebilir alan 
navbar-collapse: navbar için özel collapse ,düzgün çalışmasını sağlar
active: hangi sayfada seçili olduğunu gösterir , rengi açık olur gibi gibi vs.
-->
