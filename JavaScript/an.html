<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body{
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}
.merkez{
width: 100vw;
background-color: red;
height: 200px;
display: flex;
align-items: center;
justify-content: center;
transform: rotateX(70deg);
}
.kutu1{
    width: 200px;
    height: 200px;
    background: transparent;
    border: 5px solid blue;
    border-radius: 50%;
    animation: an1 2s infinite;
    animation-delay: 0.3s;
}
.kutu2{
    width: 100px;
    height: 100px;
    background: transparent;
    border: 5px solid blue;
    border-radius: 50%;
    position: absolute;
    justify-content: center;
    align-items: center;
    animation: an2 2s infinite;
    animation-delay: 0.15s;
}
.kutu3{
    width: 50px;
    height: 50px;
    background: transparent;
    border: 5px solid blue;
    border-radius: 50%;
    position: absolute;
    animation: an3 2s infinite;
}
@keyframes an1{
    10%{transform: translateY()}
    50%{transform: translateY(-200px)}
    }
    @keyframes an2{
    10%{transform: translateY()}
    50%{transform: translateY(-230px)}
    }
    @keyframes an3{
    10%{transform: translateY()}
    50%{transform: translateY(-260px)}
    }
</style>
<body>
 <div class="merkez">
<div class="kutu1"></div>
    <div class="kutu2"></div>
        <div class="kutu3"></div>
    
 </div>   
</body>
</html>
