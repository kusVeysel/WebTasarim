<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CDN/BootstrapCDN.css">
    <style>
        body {
            height: 200vh;
        }

        .container {
            position: relative;
            top: 150vh;
        }

        .card {
            background: blue;
            height: 200px;
            opacity: 0;
            transform: translateY(100px);
            transition: transform 1s ease-out;
        }

        .show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-4">
                <div class="card">

                </div>
            </div>
            <div class="col-4">
                <div class="card">

                </div>
            </div>
            <div class="col-4">
                <div class="card">

                </div>
            </div>

        </div>
    </div>

    <script>
        const cards = document.querySelectorAll(".card"); //* animasyon için istenilen tüm elemanlar seçilir

        const observer = new IntersectionObserver(entries => { //* gözlemci oluşturulur ve arrowfunction yazılır
            const filterElements = entries.filter(eleman => eleman.isIntersecting); //* gözlemcinin hedefine girenler filtrelenir

            filterElements.forEach((eleman, index) => { //* filterelenen elemanların herbirine ulaşmak için foreach kullanılır, foreach'te 2.parametre olarak index numarası alınır bunun amacı setTimeout'ta sürede kullanmak yani küçük bir zamanlama farkı yaratarak daha hoş gözükmesini sağlamak
                setTimeout(() => {
                    eleman.target.classList.add("show");
                    observer.unobserve(eleman.target);
                }, index * 250);
            })
        }, { threshold: 0.3 })

        cards.forEach(card => observer.observe(card));

    </script>
</body>

</html>
