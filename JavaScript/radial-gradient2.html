<style>
    body{
        overflow: hidden;
    }
#kutu{
    width: 100vw;   
    height: 100vh;
        background-image: 
    radial-gradient(rgba(109, 46, 46, 0.8) 1px,transparent 2px ),
    radial-gradient(rgba(128,128,100,0.8) 2px ,transparent 3px)
    ;
    background-size: 50px 50px,70px 70px;
    animation: bodyy 2s infinite;
}
@keyframes bodyy{
    0%{
        opacity: 1;
        transform: scale(1);
    }
    50%{
        opacity: 0.8;
        transform: scale(1);
    }
    100%{
        opacity: 1;
        transform: scale(1);
    }}

</style>
