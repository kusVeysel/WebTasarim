<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaygan Yıldızlar</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.7); /* Başlangıç parlaması */
        }

        @keyframes fadeOutTrail {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2); }
        }
    </style>
</head>
<body>
    <script>
        const starCount = 100; // Yıldız sayısı
        const stars = []; // Yıldız objelerini tutacak dizi

        function createStarElement(x, y, size, color) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.backgroundColor = color;
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
            document.body.appendChild(star);
            return star;
        }

        function initStars() {
            for (let i = 0; i < starCount; i++) {
                const size = Math.random() * 3 + 1; // 1 ile 4 piksel arası boyut
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const hue = Math.random() * 360;
                const color = `hsl(${hue}, 100%, 80%)`;

                const element = createStarElement(x, y, size, color);

                stars.push({
                    element: element,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 0.5, // Hafif yatay kayma
                    vy: Math.random() * 1 + 0.5, // Dikey hız (0.5 ile 1.5 arası)
                    size: size,
                    hue: hue
                });
            }
        }

        function animate() {
            stars.forEach(star => {
                star.x += star.vx;
                star.y += star.vy;

                if (star.y > window.innerHeight + star.size || star.x < -star.size || star.x > window.innerWidth + star.size) {
                    star.x = Math.random() * window.innerWidth;
                    star.y = -star.size; // Ekranın üstünden başla
                    star.vx = (Math.random() - 0.5) * 0.5;
                    star.vy = Math.random() * 1 + 0.5;
                    star.size = Math.random() * 3 + 1;
                    star.hue = Math.random() * 360;
                    star.element.style.width = `${star.size}px`;
                    star.element.style.height = `${star.size}px`;
                    star.element.style.backgroundColor = `hsl(${star.hue}, 100%, 80%)`;
                    star.element.style.boxShadow = `0 0 8px hsl(${star.hue}, 100%, 80%)`;
                }

                star.element.style.transform = `translate(${star.x}px, ${star.y}px)`;

                // İz (trail) parçacığı oluştur (performans için daha az sıklıkta)
                if (Math.random() < 0.3) { // İz parçacıklarının sıklığını ayarla
                    const trailParticle = document.createElement('div');
                    trailParticle.className = 'star'; // Temel stil için star sınıfını tekrar kullan
                    trailParticle.style.width = `${star.size * 0.8}px`; // Biraz daha küçük
                    trailParticle.style.height = `${star.size * 0.8}px`;
                    trailParticle.style.backgroundColor = `hsl(${star.hue}, 100%, 70%)`; // Biraz daha soluk
                    trailParticle.style.left = `${star.x}px`;
                    trailParticle.style.top = `${star.y}px`;
                    trailParticle.style.opacity = '0.8';
                    trailParticle.style.animation = 'fadeOutTrail 1s forwards ease-out';
                    trailParticle.style.boxShadow = `0 0 5px hsl(${star.hue}, 100%, 70%)`;
                    document.body.appendChild(trailParticle);

                    setTimeout(() => trailParticle.remove(), 1000); // Animasyon sonrası kaldır
                }
            });

            requestAnimationFrame(animate);
        }

        initStars();
        animate();
    </script>
</body>
</html>
