<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.ucgen{
    width: 0;
    height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 100px solid black;
}
.yıldız{
    width: 100px;
    height: 100px;
    background: gold;
    clip-path: polygon(
        50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%
    );
}
.kalp{
    position: relative;
    width: 100px;
    height: 90px;
    background: red;
    transform: rotate(-45deg);
    left: 101px;
    animation: atan 1s infinite;
}
.kalp::before,
.kalp::after{
    content: "";
    position: absolute;
    width: 100px;
    height: 90px;
    background-color: red;
    border-radius: 50%;
}
.kalp::before{
    top: -45px;
    left: 0;
}
.kalp::after{
    left: 45px;
    top: 0;
}
@keyframes atan{
    0% {transform: rotate(-45deg) scale(1);}
    50%{transform: rotate(-45deg) scale(1.1);}
}
.balon{
    width: 150px;
    height: 100px;
    background-color: #ccc;
    border-radius: 10px;
    position: relative;
}
.balon::after{
    content: "";
    position: absolute;
    bottom: -20px;
    left: 30px;
    border-width:20px 20px 0;
    border-style: solid;
    border-color: #ccc transparent transparent;
}
.ala{
    width: 0;
    height: 0;
    border: 20px solid transparent;
    border-bottom: 40px solid red;
}

</style>
<body>
  
    <div class="ucgen"></div>
    <div class="yıldız"></div>
    <div class="kalp"></div>
    <div class="balon"></div>

<div class="ala"></div>




    <script>





    </script>
</body>
</html>
