<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        height: 300vh;
        width: 200vw;
    }
#yazı{
    width: 100px;
    height: 50px;
    background-color: pink;
    position: fixed;
    transition: 10s;
    font-weight: bold;
}

button{
    width: 100px;
    height: 30px;
    position: relative;
    right: 0;
}
</style>
<body>
<div id="yazı">kaydırma</div>
<button id="bas"></button>
<script>
    window.addEventListener("scroll",()=>{
        if(scrollY>=300){
document.getElementById("yazı").innerText="hala geç değil durmak için";
        }
        if(scrollY>=500){
document.getElementById("yazı").style.background="red";
document.getElementById("yazı").innerText="artık çok geç";
        }
    })
</script>
<script>
let buton=document.getElementById("bas");
buton.addEventListener("click",function(){
window.scrollTo({
        top:500,
        behavior:"smooth"
    });
})
 


   
</script>
</body>
</html>
