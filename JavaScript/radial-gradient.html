<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
html::-webkit-scrollbar{
    display: none;
}
</style>
<body>
    

    

<div id="box"></div>

<style>
#box {
  width: 100vw;
  height: 100vh;
}
</style>

<script>
const box = document.getElementById("box");

document.addEventListener("mousemove", (e) => {
  let x = e.clientX;
  let y = e.clientY;

  box.style.background = `radial-gradient(circle at ${x}px ${y}px, red, orange,darkblue)`;
});
</script>
