<script>
    const kutular = document.querySelectorAll(".bogum");
    const fare = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    
    // Her bir kutunun konum verisini tutacak dizi
    let bogumlar = Array.from({ length: kutular.length }, () => ({ x: 0, y: 0 }));

    // Fare hareketini yakala
    window.addEventListener("mousemove", (e) => {
        fare.x = e.clientX;
        fare.y = e.clientY;
    });

    function guncelle() {
        // Hedef koordinatlar başlangıçta fare pozisyonudur
        let hedefX = fare.x;
        let hedefY = fare.y;

        bogumlar.forEach((bogum, i) => {
            // LERP FORMÜLÜ: Mevcut konum + (Hedef - Mevcut) * Yumuşaklık
            // 0.15 değeri ne kadar düşükse yılan o kadar esnek/yavaş olur
            bogum.x += (hedefX - bogum.x) * 0.1;
            bogum.y += (hedefY - bogum.y) * 0.1;

            // Görseli hareket ettir (merkezlemek için genişliğin yarısını çıkarıyoruz)
            const boyut = kutular[i].offsetWidth / 2;
            kutular[i].style.transform = `translate(${bogum.x - boyut}px, ${bogum.y - boyut}px)`;

            // BİR SONRAKİ parça, BU parçanın konumunu takip etsin
            hedefX = bogum.x;
            hedefY = bogum.y;
        });
        requestAnimationFrame(guncelle);
    }

    // İlk çalıştırma
    guncelle();
</script>
