<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body{
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}
#kutu{
    width: 50px;
    height: 50px;
    background: red;
    position: relative;
    border-radius: 50%;
}

</style>
<body>
    <div id="kutu"></div>,

    <script>
    let sayi=0;
    let ata=document.querySelector("#kutu");
    function funk(){
    sayi+=0.05;
    let x=Math.cos(sayi)*150;
    let y=Math.sin(sayi)*150;

    ata.style.transform=`translate(${x}px,${y}px)`;
    requestAnimationFrame(funk);
}
funk();



    </script>
</body>
</html>
