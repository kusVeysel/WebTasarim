<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #kutu {
            width: 100px;
            height: 100px;
            background: red;
            position: absolute;
            cursor: grab;
        }

        #kutu:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>
    <select id="sehir">
        <option value="" disabled selected>şehir seçiniz</option>
        <option value="istanbul">istanbul</option>
        <option value="ankara">ankara</option>
        <option value="izmir">izmir</option>
        <option value="bursa">bursa</option>
        <option value="kocaeli">kocaeli</option>
    </select>
    <p id="result"></p>

    <input type="text" id="inp">
    <p id="text"></p>

    <button type="button" id="buton">Tıkla</button>

    <div id="kutu"></div>

    <script>
        const sehir = document.getElementById("sehir")
        sehir.addEventListener("change", function () { //* sehir id'li etiketin change'ni dinler
            document.getElementById("result").innerText = this.value; //* bu değeri(dinlediği değeri) result id'li etiketin text'ine atar
        })

        const kutu = document.getElementById("kutu");
        let deger = false;
        let x, y;

        kutu.addEventListener("mousedown", (e) => { //* kutu id'li etiketin mousedown'u(fare basılı olduğunda) dinler
            deger = true;
            x = e.clientX - kutu.offsetLeft;
            y = e.clientY - kutu.offsetTop;
        });
        window.addEventListener("mousemove", (e) => { //* window'un faresini dinler
            if (deger) {
                kutu.style.left = (e.clientX - x) + "px";
                kutu.style.top = (e.clientY - y) + "px";
            };
        })
        kutu.addEventListener("mouseup", () => { //* kutu id'li etiketin mouseup'u(fare bırakıldığında) dinler
            deger = false;
        });
        kutu.addEventListener("mouseover", function () { //* sehir id'li etiketin mouseover olup olmadığını dinler
            kutu.style.background = "blue" //* mouseover olduğunda(fare üzerine geldiğinde) ,ana arka plan kırmızı olur
        })
        kutu.addEventListener("mouseout", function () { //* sehir id'li etiketin mouseout olup olmadığını dinler
            kutu.style.background = "red" //* mouseout olduğunda(fare üzerinden ayrıldığında) ,ana arka plan beyaz olur
        })
        //* Mouse Eventleri
        // mouseup
        // mousedown
        //* İkisi birlikte click eventi yaratır
        // mousemove fareyi izler(takip eder)
        // mouseover
        // mouseout
        // İkisi birlikte hover efekti yaratır


        document.getElementById("inp").addEventListener("input", function () { //* inp id'li etiketin inputunu dinler
            document.getElementById("text").innerText = this.value; //* bu değeri(dinlediği değeri) text id'li etiket'in text'ine atar
        })

        document.getElementById("buton").addEventListener("click", function () { //* buton id'li etiketin click olup olmadığı dinler
            alert("Tıklandı") //* click olduğunda Tıklandı alertini verir
        })

        window.addEventListener("load", function () {
            alert("sayfa Yüklendi")
        }) //* Sayfa yüklendiğinde çalışır


        //! eventler asenkron çalıştığı için dinlediği an yapar ,yani aynı anda 2 ya da daha fazla kod çalışır . Bu ileri düzey bi konudur
    </script>
</body>

</html>
<!-- 
Genel Mantık
1- Elemanı seç (id,class)
2- Elemanı dinle (addEventListener)
3- Elemanın neyini dinleyeceksin (input,change,mousemove...)
4- bu dinleme esnasında ne olacak (addEventListener içine yazılır)

const a = document.getElementById("id") 
a.addEventListener("",function(){
    a.style.color="red"
})
-->
