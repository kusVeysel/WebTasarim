<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
#kutu{
    width: 100px;
    height: 100px;
    color: black;
    background: pink;
}
button{
    width: 100px;
    height: 30px;
    background: green;
    color: white
}
</style>
<body>
    <div id="kutu" >0</div>
<button id="tıkla">tıkla</button>

    <script>
           let i=0;
        document.getElementById("tıkla").addEventListener("click",function(){
            document.getElementById("kutu").innerHTML=i+1;
            i++;
     })

    </script>
</body>
</html>
