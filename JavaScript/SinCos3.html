<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    background: #222;
  }

  .box {
    width: 50px;
    height: 50px;
    background: orange;
    margin-bottom: 50px;
  }
</style>
</head>
<body>

<div class="box"></div>

<script>
let angle = 0;
let box = document.querySelector(".box");

function animate() {
  angle += 0.1;

  
  let y = Math.abs(Math.sin(angle)) * 150;                                                             

  box.style.transform = `translateY(-${y}px)`;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
