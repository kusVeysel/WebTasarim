<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    html{
        font-size:16px;
    }
.kutu{
font-size: clamp(2rem,1.5vw,3rem);
padding: 1em 1.5em;
background: #444;
border-radius: 0.6em;
position: relative;
display: inline-block;
}
.kutu::after{
    content: "";
    position: absolute;
    bottom: -0.7em;
    left: 1.5em;
    width: 0;
    height: 0;
    border-left: 0.6em solid transparent;
    border-right: 0.6em solid transparent;
    border-top: 0.8em solid #444;
}
.kutu2{
    width: 10vw;
    height: 8vh;
    background-color: red;
    position: relative;
}
.kutu2::after{
    position: absolute;
    top: 8vh;
    content: "";
    width: 0;
    height: 0;
    border-left:5vw solid transparent ;
    border-right:5vw solid transparent ;
    border-top: 5vh solid red;
}
</style>
<body>
    <div class="kutu"></div>
</body>
</html>
