<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="email" id="email" placeholder="Email">
    <button onclick="kontrol()">Kontrol Et</button>
    <p id="mesaj"></p>

    <br>
    <p id="yazi">merhaba</p>
    <button onclick="degistir()">değiştir</button>
    <br>
    
    <input type="text" id="isim">
    <button onclick="goster()">Göster</button>
    <p id="sonuc"></p>


<script>
    function kontrol(){
        let email=document.getElementById("email").value;
        document.getElementById("mesaj").innerText="girdiğin email "+email;
    }
    function degistir(){
        document.getElementById("yazi").toinnerText="bugün cumartesi";
    }
    function goster(){
        let isim=document.getElementById("isim").value;
        document.getElementById("sonuc").innerText=isim;
    }
</script>
</body>
</html>
