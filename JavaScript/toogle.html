<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
        background: white;
        color: black;
        transition: 0.6s;
    }

    .dark {
        background-color: #121212;
        color: white;
    }

    button {
        cursor: pointer;
        padding: 10px;
    }
</style>

<body>
    <h2>Tema Değiştirme</h2>
    <button id="temaBtn">Karanlık Mod</button>

    <script>
        let btn = document.getElementById("temaBtn");

        btn.addEventListener("click", function () {
            document.body.classList.toggle("dark");
            if (document.body.classList.contains("dark")) {
                btn.innerText = "Açık Mod";
            }
            else {
                btn.innerText = "Karanlık Mod";
            }
        })

    </script>
</body>

</html>
