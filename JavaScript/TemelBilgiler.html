<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="kutu1"></div>
    <input type="text" id="input1" placeholder="Bir şeyler yazın">
    <button id="buton1">Tıkla</button>

    <script>
        const kutu1 = document.getElementById("kutu1"); // id'si kutu1 olan elementi seçer
        const input1 = document.getElementById("input1"); // id'si input1 olan elementi seçer
        const buton1 = document.getElementById("buton1"); // id'si buton1 olan elementi seçer

        document.addEventListener("DOMContentLoaded", function () { // Sayfa yüklendiğinde bu fonksiyon çalışır
            kutu1.innerText = "Merhaba jQuery"; // kutu1'in içeriğini değiştirir
        });

        buton1.addEventListener("click", function () { // buton1'e tıklandığında bu fonksiyon çalışır
            const inputValue = input1.value; // input1'in değerini alır
            kutu1.innerText = inputValue; // kutu1'in içeriğini input1'in değeri ile değiştirir
            kutu1.innerHTML = "<p>ali</p>"; //html'i kutu1'e ekler 
        });

    </script>
</body>

</html>
<!-- 

document: DOM
body: Sayfa
addEventListener: etkinlik dinleyici
const - let: sabit - değişken


-->
