<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }
#kutu{
    width: 40px;
    height: 40px;
    background: red;
    border-radius: 5%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#kutu2{
    width: 40px;
    height: 40px;
    background: green;
    border-radius: 5%;
    position: relative;
    top: 100px;
    
    display: flex;
    align-items: center;
    justify-content: center
}
#ana{
    display: flex;
    gap: 200px;
}
#soru {
    background: blue;
    font-size: bold;
    padding: 20px;
    border: 3px solid black;
    border-radius: 10%;
    position: absolute;
    top:400px;
}
#yardım{
    width: 200px;
    background: transparent;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    
}
#kut{
    display: flex;
    justify-content: space-between;
    width: 500px;
}
</style>
<body>
    <div id="soru">Beni Seviyor Musun?</div>
    <div id="ana">
<div id="kut">
<button id="kutu2">Evet</button>
<div id="yardım">
<button id="kutu"></button>
</div>
</div>
    </div>



    <script>
        const buton=document.getElementById("kutu");
        buton.innerText="Hayır";
        window.addEventListener("mousemove",(e)=>{
            const sec=document.querySelectorAll("#kutu");

            sec.forEach(elem => {
                const ana=elem.parentElement;
                const yon=ana.getBoundingClientRect();

                const x=yon.width/2 +yon.left;
                const y=yon.height/2 + yon.top;

                const acı=Math.atan2(
                    e.clientY - y,
                    e.clientX - x
                );
                const maks=30;
                const x1=Math.cos(acı)*maks;
                const y1=Math.sin(acı)*maks;

        elem.style.transform = `translate(${-x1}px, ${-y1}px)`;


        });
});


    </script>
</body>
</html>
