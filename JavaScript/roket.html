<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        height: 200vh;
        background: black;
    }
#daire{
    width: 200px;
    height: 200px;
    background: rgb(231, 231, 231);
    border-radius: 50%;
    position: fixed;
    bottom: 5vh;
    right: 5vw;
}
#ileri{
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #bebebe;
    position: absolute;
    top: 5%;;
    left: 75px;
    display: flex;
    justify-content: center;
    align-items: center
}
#geri{
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #bebebe;
    position: absolute;
    bottom: 5%;;
    left: 75px;
    display: flex;
    justify-content: center;
    align-items: center
}
#saga{
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #bebebe;
    position: absolute;
    top: 75px;
    right: 5%;
    display: flex;
    justify-content: center;
    align-items: center
}
#sola{
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #bebebe;
    position: absolute;
    top: 75px;;
    left: 5%;
    display: flex;
    justify-content: center;
    align-items: center
}
#ok1{
    width: 30px;
    height: 30px;
    background: black;
    clip-path: polygon(0% 100%,50% 0%,100% 100%,80% 100%,50% 60%,20% 100%);
}
#ok2{
    width: 30px;
    height: 30px;
    background: black;
    clip-path: polygon(0% 0%,50% 100%,100% 0,80% 0%,50% 30%,20% 0%);
}
#ok3{
    width: 30px;
    height: 30px;
    background: black;
    clip-path: polygon(0% 0%,50% 100%,100% 0,80% 0%,50% 30%,20% 0%);
    rotate: -90deg;

}
#ok4{
    width: 30px;
    height: 30px;
    background: black;
    clip-path: polygon(0% 0%,50% 100%,100% 0,80% 0%,50% 30%,20% 0%);
    rotate: 90deg;
}
#roket{
    width: 200px;
    height: 400px;
    background: red;
    position: absolute;
    border-radius: 50%;
    top: 200vh;
    left: 50vh;
}
#parcasol{
    width: 100px;
    height: 200px;
    clip-path: polygon(0 100% ,10% 30%,100% 0);
    background: orange;
    position: absolute;
    left: -35px;
    bottom: -60px;
}
#parcasag{
    width: 100px;
    height: 200px;
    clip-path: polygon(0 100% ,10% 30%,100% 0);
    background: orange;
    position: absolute;
    right: -35px;
    bottom: -60px;
    transform:rotateY(180deg);
}
#cam{
    width: 100px;
    height: 70px;
    border-radius: 50%;
    background: white;
    position: absolute;
    top: 40px;
    left: 50px;
}
</style>
<body>
    

<div id="daire">
    <div id="ileri">
        <div id="ok1"></div>
    </div>
    <div id="geri">
        <div id="ok2"></div>
    </div>
    <div id="saga">
        <div id="ok3"></div>
    </div>
    <div id="sola">
        <div id="ok4"></div>
    </div>
</div>

<div id="roket">
    <div id="cam"></div>
    <div id="parcasol"></div>
    <div id="parcasag"></div>
</div>

    </script>
</body>
</html>
