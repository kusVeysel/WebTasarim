<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takip Eden Göz</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye {
            width: 120px;
            height: 80px;
            background: white;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #333;
        }

        .pupil {
            width: 35px;
            height: 35px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.05s linear;
        }

        .box {
            width: 40px;
            height: 40px;
            background: #00ffcc;
            position: absolute;
            border-radius: 8px;
            box-shadow: 0 0 20px #00ffcc;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="eye">
        <div class="pupil"></div>
    </div>

    <div id="box" class="box">JS</div>

    <script>
        const box = document.getElementById('box');
        const eye = document.querySelector('.eye');
        const pupil = document.querySelector('.pupil');

        let posX = Math.random() * (window.innerWidth - 40);
        let posY = Math.random() * (window.innerHeight - 40);
        let speedX = 4;
        let speedY = 4;

        function update() {
            posX += speedX;
            posY += speedY;

            // Kenar Çarpmaları
            if (posX + 40 > window.innerWidth || posX < 0) {
                speedX *= -1;
            }
            if (posY + 40 > window.innerHeight || posY < 0) {
                speedY *= -1;
            }

            box.style.left = posX + 'px';
            box.style.top = posY + 'px';

            const eyeRect = eye.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;

            const targetX = posX + 20;
            const targetY = posY + 20;

            const angle = Math.atan2(targetY - eyeCenterY, targetX - eyeCenterX);
            const maxMove = 25; 
            
            const moveX = Math.cos(angle) * maxMove;
            const moveY = Math.sin(angle) * maxMove;

            pupil.style.transform = `translate(${moveX}px, ${moveY}px)`;

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
