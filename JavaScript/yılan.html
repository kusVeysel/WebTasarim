<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
#ana div{
    width: 70px;
    height: 70px;
    background: darkgreen;
    border-radius: 50%;

}
#ana{
    width: 490px;
    height: 70px;
    display: flex;
}
</style>
<body>

    <nav id="ana">
        <div id="kutu1"></div>
        <div id="kutu2"></div>
        <div id="kutu3"></div>
        <div id="kutu4"></div>
        <div id="kutu5"></div>
        <div id="kutu6"></div>
        <div id="kutu7"></div>
    </nav>



    <script>
      const kutular = document.querySelectorAll("#ana div");
let mouseX = 0, mouseY = 0;
let noktalar = []; // Farenin geçtiği yolları tutacak olan dizi

// 1. Fare hareketini dinle ve koordinatları güncelle
window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function yilanHareket() {
    // Farenin anlık konumunu dizinin başına ekle
    noktalar.unshift({ x: mouseX, y: mouseY });

    // Gereksiz veri birikmemesi için diziyi kutu sayısına göre sınırla
    if (noktalar.length > kutular.length * 5) {
        noktalar.pop();
    }

    kutular.forEach((kutu, index) => {
        // "index * 5" değeri boğumlar arasındaki mesafeyi belirler. 
        // 5 yerine 10 yaparsan yılan daha uzun ve seyrek olur.
        let hedefNokta = noktalar[index * 5] || noktalar[0];

        kutu.style.transform = `translate(${hedefNokta.x}px, ${hedefNokta.y}px)`;
    });
    requestAnimationFrame(yilanHareket);
}
yilanHareket();
    </script>
</body>
</html>
