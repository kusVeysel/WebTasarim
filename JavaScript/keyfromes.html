<style>
.kutu{
    width: 100px;
    height: 100px;
    background: blue;
    animation: animasyon 3s infinite;
}
@keyframes animasyon{
    0%{transform: rotateY(0)  translate(0);}
    100%{transform: rotateX(180deg)  translate(30px);}
}






</style>

    <div class="kutu"></div>
