<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<input type="text" id="name" placeholder="adınızı yazınız">
<p id="result"></p>


<script>
document.getElementById("name").addEventListener("input",function(){{
    let values =document.getElementById("name").value;
    document.getElementById("result").innerText=values;
}})


</script>

<select  id="sehir">
<option value="">şehir seçiniz</option>
<option>istanbul</option>
<option>ankara</option>
<option>izmir</option>
<option>bursa</option>
<option>kocaeli</option>
</select>
<p id="yazi"></p>

<script>
document.getElementById("sehir").addEventListener("change",function(){
    let secilen =this.value;
    document.getElementById("yazi").innerText="seçilen şehir :"+ secilen;
})

</script>


<br> <br>
<div id="kutu" style="width: 200px; height: 100px;background-color: blue; color: white;">üzerime gel</div>

<script>
document.getElementById("kutu").addEventListener("mouseover",function(){
this.style.background="orange";
})
document.getElementById("kutu").addEventListener("mouseout",function(){
this.style.background="blue";

})


</script>


</body>
</html>

click = tıklama
input = canlı takip
