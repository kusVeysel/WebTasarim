<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="yazi">
    <select id="renk">
        <option value="">renk seçiniz</option>
        <option value="red">kırmızı</option>
        <option value="blue">mavi</option>
        <option value="yellow">sarı</option>
        <option value="black">nigga</option>
    </select>

    <div id="box" style="width: 200px;height: 100px;background-color: gray;margin-top: 10px;">kutu</div>
<script>
document.getElementById("yazi").addEventListener("input",function(){
document.getElementById("box").innerText=this.value;
})
document.getElementById("renk").addEventListener("change",function(){
    document.getElementById("box").style.background=this.value;
})
document.getElementById("box").addEventListener("mouseover",function(){
    document.getElementById("box").style.border="solid 3px darkgreen";
})
document.getElementById("box").addEventListener("mouseout",function(){
    document.getElementById("box").style.border="none";
})
</script>

</body>
</html>
