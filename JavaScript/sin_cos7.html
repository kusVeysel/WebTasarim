<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon DNA Sarmalı</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes helixFade {
            0% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0.2); }
        }
    </style>
</head>
<body>
    <script>
        let t = 0;

        function createParticle(x, y, color) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.left = `calc(50% + ${x}px)`;
            dot.style.top = `calc(50% + ${y}px)`;
            dot.style.backgroundColor = color;
            dot.style.boxShadow = `0 0 15px ${color}`;
            dot.style.animation = 'helixFade 1.5s forwards';
            document.body.appendChild(dot);
            
            setTimeout(() => dot.remove(), 1500);
        }

        function animate() {
            t += 0.05;

            // Sarmalın genişliği ve yüksekliği
            const amplitude = 150; 
            const verticalSpacing = t * 20; // Zamanla aşağı akış hissi

            // Birinci dalga (Mavi Tonları)
            const x1 = Math.sin(t) * amplitude;
            const y1 = Math.cos(t * 0.5) * (amplitude / 2); // 3D dönme hissi için
            const color1 = `hsl(190, 100%, 50%)`;

            // İkinci dalga (Zıt yönlü - Mor Tonları)
            const x2 = Math.sin(t + Math.PI) * amplitude;
            const y2 = Math.cos(t * 0.5 + Math.PI) * (amplitude / 2);
            const color2 = `hsl(280, 100%, 60%)`;

            // Parçacıkları oluştur
            createParticle(x1, y1, color1);
            createParticle(x2, y2, color2);

            // Aradaki "bağ" çizgilerini taklit eden küçük noktalar
            if (Math.floor(t * 10) % 2 === 0) {
                createParticle(0, 0, '#333'); // Merkez referans noktası
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
