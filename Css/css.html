<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS A Özellikleri Mini Proje</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="avatar">V</div>

            <div class="content">

                <h1>CSS Developer</h1>

                <p>
                    Modern CSS özelliklerini kullanarak hazırlanmış
                    animasyonlu profil kartı.
                </p>

                <div class="skills">
                    <span>HTML</span>
                    <span>CSS</span>
                    <span>JavaScript</span>
                </div>

                <label class="remember">
                    <input type="checkbox">
                    Animasyonları etkinleştir
                </label>

                <button class="reset">Sıfırla</button>

            </div>

            <div class="badge">
                ACTIVE
            </div>

        </div>

    </main>

</body>

</html>
