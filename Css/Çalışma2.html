<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: Arial, Helvetica, sans-serif;

    }
.a1{
    background-color: aquamarine;
    width: 400px;
    display: flex;
    padding: 15px;
    border-radius: 40%;
    justify-content:space-between;
    color:black;
}
.a1 span{
    position: relative;
    top: 10px;
    left: 30px;
    font-size: 20px;
}
.kutu2{
    position: relative;
    right: 1000px;
    background-color: blueviolet;
    padding: 3px;
    border-radius: 10%;
    padding: 10px;
    color: white;

}
.kutu1{
    position: relative;
    left: 10%;
    background-color: blueviolet;
    padding: 3px;
    border-radius: 10%;
    padding: 10px;
    color: white;

}
.a1:hover  {
    background-color: red;

}
.kutu1:hover{
    background-color: darkblue;
    color: orange;
    cursor: pointer;
}
.kutu2:hover{
    background-color: darkblue;
    color: orange;
    cursor: pointer;
    }
#gizli1{
    display: none;
}
#gizli2{
    display: none;
}
.aşk1{
position: relative;
top: 390px;
right: 160px;
width: 100px;
height: 70px;
background: rgb(100, 4, 4);
color: white;
border-radius:100% ;
transition: 4s;
}

#gizli1:checked ~ .aşk1{
     top:143px;
}
.aşk1::before{
    content: "üzerime gel";
        position: relative;
    left: 10px;
    top: 24px;
}
.aşk1::after{
    content: "öpüşelim mi";
    display: none;
            position: relative;
    left: 14px;
    top: 24px;
}
.aşk1:hover::before{
    display: none;
}
.aşk1:hover::after{
  display: block;
}

.aşk2{
position: relative;
top: -300px;
right: 160px;
width: 100px;
height: 70px;
background: rgb(100, 4, 4);
color: white;
border-radius:100% ;
transition: 4s;

}
#gizli2:checked ~ .aşk2{
     top:-120px;
}
.aşk2::before{
    content: "niye kaçıyorsunki";
    position: relative;
    left: 10px;
    top: 15px;
}
.aşk2::after{
    content: "öpüşelim mi";
    display: none;
    position: relative;
    left: 14px;
    top: 24px;
}
.aşk2:hover::before{
    display: none;
}
.aşk2:hover::after{
  display: block;
}


</style>
<body>
    
    <input type="checkbox" id="gizli1">
    <input type="checkbox" id="gizli2">
    
<div class="a1"><span>kutu1'e sakın basma</span>
    <label for="gizli1" class="kutu1">kutu1</label>
    <label for="gizli2" class="kutu1">kutu2</label>
</div>

<div class="aşk1"></div>
<div class="aşk2"></div>

</body>
</html>
