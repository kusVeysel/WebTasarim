    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body {
            display: flex;
            height: 100vh;
        }

            height: 100px;
            background-color: red;
        }
    </style>

<!-- 
align-items:
start → Öğeleri yazı/yazım yönüne göre başlangıç tarafına hizalar.
end → Öğeleri yazı/yazım yönüne göre bitiş tarafına hizalar.
center → Öğeleri çapraz eksenin ortasına hizalar. En sık kullanılan değerlerden biridir; navbar, kart, buton ve header gibi yapılarda çok kullanılır.
stretch → Öğeleri çapraz eksende konteyneri dolduracak şekilde esnetir. align-items için varsayılan davranıştır.
flex-start → Öğeleri çapraz eksenin başlangıç tarafına hizalar. Üstten veya başlangıçtan hizalanmış kart, form ve içerik düzenlerinde kullanılır.
flex-end → Öğeleri çapraz eksenin bitiş tarafına hizalar. Alt veya bitiş tarafına hizalama gereken tasarımlarda kullanılır.
baseline → Öğelerin yazı taban çizgilerini (baseline) hizalar. Özellikle farklı yazı boyutlarının yan yana olduğu başlık, fiyat, bilgi ve menü alanlarında hoş bir fark yaratır.
animation:


accent-color → Form kontrollerinin vurgu rengini belirler.
align-content → Flex/Grid içindeki satır veya sütun gruplarının container içindeki hizalanmasını ve dağılımını belirler.
align-items → Flex/Grid öğelerinin çapraz eksende hizalanmasını belirler.
align-self → Tek bir Flex/Grid öğesinin çapraz eksendeki hizalamasını belirler; align-items değerini geçersiz kılabilir.
all → Bir elementin neredeyse tüm CSS özelliklerini aynı anda initial, inherit, unset veya revert durumuna getirir.
animation → Animasyonun ad, süre, hız eğrisi, gecikme, tekrar, yön, dolgu ve oynatma gibi özelliklerini tek seferde tanımlar.
animation-delay → Animasyonun başlamadan önce ne kadar bekleyeceğini belirler.
animation-direction → Animasyonun normal, ters veya dönüşümlü yönde oynatılmasını belirler.
animation-duration → Animasyonun bir döngüsünün ne kadar süreceğini belirler.
animation-fill-mode → Animasyon başlamadan önce veya bittikten sonra elementin hangi animasyon durumunu koruyacağını belirler.
animation-iteration-count → Animasyonun kaç kez tekrarlanacağını belirler.
animation-name → Kullanılacak @keyframes animasyonunun adını belirtir.
animation-play-state → Animasyonun oynatılmasını veya duraklatılmasını kontrol eder.
animation-timing-function → Animasyonun zaman içinde hangi hız eğrisiyle ilerleyeceğini belirler.
animation-timeline → Animasyonun ilerlemesini belirli bir zaman çizelgesine, örneğin scroll hareketine, bağlar.

-->
