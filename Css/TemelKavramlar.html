<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* css bu etiketler arasına yazılır  */
        body {
            display: flex;
            /* elementleri yan yana hizalar */
            align-items: center;
            /* dikeyde ortalar  */
            justify-content: center;
            /* yatayda ortalar */
            height: 100vh;
            /* bu 4 komut beraber kullanıldığında sayfadaki her şeyi ortaya alır */
        }

        #kutu {
            color: red;
            /* yazı rengi verir */
            background-color: blue;
            /* kutu rengi verir */
            height: 100px;
            /* yükseklik verir */
            width: 100px;
            /* genişlik verir */
            text-align: center;
            /* yazıyı yatayda ortalar */
            padding: 5px;
            /* kutuya iç boşluk verir */
            margin: 5px;
            /* kutuya dış boşluk verir */
            border-radius: 20px;
            /* kutunun kenarlarını yuvarlar */
            border: 5px solid green;
            /* kenarlık verir */
        }
    </style>
</head>

<body>

    <div id="kutu">
        Merhaba
    </div>

</body>

</html>
