<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.kutu1{
    width: 100px;
    height: 100px;
    background-color: red;
    position: relative;
    z-index: 2;

}
.kutu2{
    width: 100px;
    height: 100px;
    background-color: blue;
    position: relative;
    top: -50px;
    left: 50px;
    z-index: 1;
}
</style>
<body>
    
    <div class="kutu1">kutu 1</div>
    <div class="kutu2">kutu 2</div>
 


</body>
</html>
<!--
z-index  hangi kutu üstte hangisi altta dursunun cevabı,elemanda positive static harici position olmalı
sayısal değeri büyük olan üstte olur
-->
