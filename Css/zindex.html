<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS z-index - Full</title>

    <style>
        /* ==================================================
           ORTAK TASARIM
           ================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background: #f4f4f4;
        }

        h2 {
            margin-top: 50px;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            min-height: 220px;

            margin-bottom: 35px;
            padding: 30px;

            position: relative;

            border: 3px solid black;
            border-radius: 20px;

            background: white;

            overflow: hidden;
        }

        .box {
            width: 130px;
            height: 100px;

            display: grid;
            place-items: center;

            border-radius: 15px;

            color: white;
            font-weight: bold;

            position: absolute;
        }


        /* ==================================================
           1. z-index: auto
           ==================================================

           Varsayılan değerdir.

           Element özel bir z-index katmanı oluşturmaz.
        */

        .auto {
            z-index: auto;

            background: steelblue;

            top: 40px;
            left: 80px;
        }


        /* ==================================================
           2. z-index: 1/10
           ==================================================

           Pozitif z-index.

           Daha yüksek z-index,
           aynı stacking context içerisinde
           genellikle üstte görünür.
        */

        .z1 {
            z-index: 1;

            background: steelblue;

            top: 50px;
            left: 100px;
        }


        .z10 {
            z-index: 10;

            background: crimson;

            top: 80px;
            left: 170px;
        }


        /* ==================================================
           3. z-index karşılaştırması
           ==================================================

           z-index: 30
           > z-index: 20
           > z-index: 10
           */

        .compare-1 {
            z-index: 10;

            background: steelblue;

            top: 50px;
            left: 80px;
        }

        .compare-2 {
            z-index: 20;

            background: seagreen;

            top: 80px;
            left: 130px;
        }

        .compare-3 {
            z-index: 30;

            background: crimson;

            top: 110px;
            left: 180px;
        }
    </style>

</head>

<body>

    <!-- ==================================================
         1. AUTO
         ================================================== -->

    <h2>1. z-index: auto</h2>
    <div class="container">
        <div class="box auto">
            auto
        </div>
    </div>


    <!-- ==================================================
         2. BASIC VALUES
         ================================================== -->

    <h2>2. z-index: 1 / 10</h2>
    <div class="container">
        <div class="box z1">
            z-index: 1
        </div>
        <div class="box z10">
            z-index: 10
        </div>
    </div>


    <!-- ==================================================
         3. COMPARISON
         ================================================== -->

    <h2>3. z-index karşılaştırması</h2>
    <div class="container">
        <div class="box compare-1">
            10
        </div>
        <div class="box compare-2">
            20
        </div>
        <div class="box compare-3">
            30
        </div>
    </div>


</body>

</html>
