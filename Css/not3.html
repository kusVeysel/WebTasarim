<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .kutu {
        background: linear-gradient(90deg, red, blue, green);
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 300px;
        font-weight: bold;
        background-size: 200% 100%;
    }

    .kutu2 {
        font-size: 64px;
        font-weight: bold;

        background: linear-gradient(270deg, yellow, red, blue, green, orange);
        background-size: 600% 600%;
        animation: of 5s ease infinite;
        background-clip: text;
        -webkit-text-fill-color: transparent;

    }

    .kutu3 {
        width: 400px;
        height: 400px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        text-shadow: 10px 10px 10px black;

        background: linear-gradient(-45deg, red, orange, yellow, green, cyan, blue, purple, red, orange, yellow, green);
        animation: of 3s linear infinite;
        background-size: 580% 100%;

    }

    .kutu3:active {
        background: linear-gradient(-45deg, black, white, black, white);
        animation: of 3s linear infinite;
        background-size: 500% 100%;
    }

    p {
        font-size: 64px;
        font-weight: bold;
        background: linear-gradient(-45deg, blue, green, purple, orange, red, white, pink, blue, green, purple, orange, red);
        background-size: 600% 600%;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: of 6s ease infinite;
    }

    @keyframes of {
        to {
            background-position: 100% 50%;
        }

        from {
            background-position: 0% 50%;
        }
    }
</style>

<body>

    <div class="kutu">merhaba dünya</div> <br> <br>
    <div class="kutu2">merhaba dünya</div> <br> <br> <br> <br>
    <div class="kutu3">
        <p>merhaba dünya</p>
    </div>


</body>

</html>
