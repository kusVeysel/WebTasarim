<html lang="en">

<head>

</head>
<style>
    /*.kutu{

    .kutu {
        width: 50%;
        background-color: lightblue;
    }

    .kutu2 {
        width: 100%;
        padding: 20px;
        background-color: blue;
        box-sizing: border-box;
    }

    .kutu3 {
        width: 100%;
        background-color: orange;
        max-width: 600px;
    }

    .kutu4 {
        min-width: 300px;
        background-color: aqua;
        width: 100%;
        min-height: 100px;

    }
</style>

<body>

    <div class="kutu">kutu</div> <br>
    <div class="kutu2">kutu2</div> <br>
    <div class="kutu3">kutu3</div> <br>
    <div class="kutu4">kutu4</div>

</body>
