<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box1 {
        width: 100px;
        height: 100px;
        background: red;
        clip-path: path("M10 80 Q 95 10 180 80 T 330 80");
    }

    .box2 {
        width: 100px;
        height: 100px;
        background: orange;
        clip-path: polygon(50% 0, 65% 30%, 100% 30%, 73% 55%, 86% 90%,
                50% 70%,
                14% 90%, 27% 55%, 0% 30%, 35% 30%);
    }

    .box3 {
        width: 100px;
        height: 100px;
        background: darkblue;
        clip-path: path("M0 0 L100 0 L100 80 C 80 100 30 100 0 80 Z");
    }

    .box4 {
        width: 400px;
        height: 300px;
        background: darkgreen;
        width: 400px;
        height: 300px;
        background: dodgerblue;
        clip-path: path("M 20 250 L 20 50 H 100 V 100 C 120 20 180 20 200 100 S 280 180 300 100 Q 320 50 350 100 T 380 180 A 40 40 0 0 1 300 220 Z");
    }

    .box5 {
        width: 100px;
        height: 100px;
        background: transparent;
        /* transparent görünmez yapar */
        border: 5px solid red;
        border-radius: 50%;


    }
</style>

<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
</body>

</html>
<!-- 

clip-path:

polygon(x1% y1%, x2% y2%, ...) : noktalar koyar ve sonra bu noktaları birleştirir ,yüzde hesabı çizer
path() : polygon gibi ama polygondan farklı olarak kavis verilebilir ve piksel hesabı çizer
M → Move (başlangıç/konum noktasına git)
L → Line (düz çizgi çiz)
C → Cubic Bézier (2 kontrol noktalı eğri çiz)
Q → Quadratic Bézier (1 kontrol noktalı eğri çiz)
Z → Close Path (path'i başlangıç noktasına bağlayıp kapat)
H → Horizontal Line (yatay çizgi çiz)
V → Vertical Line (dikey çizgi çiz)
S → Smooth Cubic Bézier (yumuşak devam eden kübik eğri çiz)
T → Smooth Quadratic Bézier (yumuşak devam eden kuadratik eğri çiz)
A → Arc (yay/elips eğrisi çiz)

-->
