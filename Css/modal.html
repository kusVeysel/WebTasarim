<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: 1.7s;
    }

    .modal-box {
        width: 180px;
        height: 120px;
        background-color: white;
        border-radius: 10px;
        transition: 1s;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;

    }

    .open:hover+.modal {
        opacity: 2;
        /*belirginlik*/
        pointer-events: auto;
        /* tıklanabilir, üstüne gelir açılır*/
    }

    .open:hover+.modal .modal-box {
        transform: scale(1.5);
        /*merkeze doğru büyütmek*/
    }
</style>

<body>
    <button class="open">Bilgi</button>
    <div class="modal">
        <div class="modal-box">
            <p>Bu bir papap</p>
        </div>
    </div>

</body>

</html>
