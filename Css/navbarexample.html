<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body{
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f2f2f2;
}
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background-color: black;
}
.logo{
    color: white;
    font-weight: bold;
}
.menu a{
    text-decoration: none;
    color: white;
    margin-left: 15px;
}
.kartlar{
    display: flex;
    flex-wrap: wrap; /* ekrana sığmazsa alta geç*/
    gap: 10px;
    padding: 20px;
}
.kart{
    width: 30%;
    background-color: white;
    padding: 20px;
}
@media(max-width:600px){
    .navbar{
        flex-direction: column; /*menüyü alt alta düşürür*/
    }
    .menu a{
        display: block;
        margin: 5px;
    }
    .kart{
        width: 100%;
    }
}


</style>
<body>
    


<div class="navbar">
    <div class="logo">Logo</div>
    <div class="menu">
        <a href="#">Anasayfa</a>
        <a href="#">Hakkımızda</a>
        <a href="#">İletişim</a>
    </div>
</div>
<div class="kartlar">
    <div class="kart">kart 1</div>
    <div class="kart">kart 2</div>
    <div class="kart">kart 3</div>
</div>

















</body>
</html>
