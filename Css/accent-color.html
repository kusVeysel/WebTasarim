<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>CSS accent-color - Tüm Değerler</title>

    <style>
        /* ==================================================
       ORTAK TASARIM
       ================================================== */

        .container {
            display: flex;
            align-items: center;
            gap: 20px;

            margin-bottom: 30px;
            padding: 25px;

            border: 3px solid black;
        }


        /* ==================================================
       1. accent-color: auto
       ==================================================

       Tarayıcının varsayılan vurgu rengini kullanır.

       Elementin görünümü tamamen tarayıcıya bağlıdır.
    */

        .auto {
            accent-color: auto;
        }


        /* ==================================================
       2. accent-color: red
       ==================================================

       Vurgu rengini kırmızı yapar.

       Checkbox, radio, range ve progress gibi
       desteklenen form kontrollerinde görülür.
    */

        .red {
            accent-color: red;
        }


        /* ==================================================
       3. accent-color: blue
       ==================================================

       Vurgu rengini mavi yapar.
    */

        .blue {
            accent-color: blue;
        }


        /* ==================================================
       4. accent-color: green
       ==================================================

       Vurgu rengini yeşil yapar.
    */

        .green {
            accent-color: green;
        }


        /* ==================================================
       5. accent-color: purple
       ==================================================

       Vurgu rengini mor yapar.
    */

        .purple {
            accent-color: purple;
        }


        /* ==================================================
       6. HEX RENK
       ==================================================

       Hexadecimal renk kodu kullanılabilir.

       #ff6600 → Turuncu
    */

        .hex {
            accent-color: #ff6600;
        }


        /* ==================================================
       7. RGB
       ==================================================

       RGB ile renk belirtilebilir.
    */

        .rgb {
            accent-color: rgb(0, 120, 255);
        }


        /* ==================================================
       8. RGBA
       ==================================================

       RGBA ile alpha değeri de belirtilebilir.

       Ancak accent-color'da saydamlık tarayıcıya göre
       farklı yorumlanabilir.
    */

        .rgba {
            accent-color: rgba(255, 0, 0, 0.8);
        }


        /* ==================================================
       9. HSL
       ==================================================

       HSL renk sistemi kullanılabilir.
    */

        .hsl {
            accent-color: hsl(270, 70%, 50%);
        }


        /* ==================================================
       10. OKLCH
       ==================================================

       Modern renk fonksiyonları da kullanılabilir.

       Tarayıcı desteği modern tarayıcılara bağlıdır.
    */

        .oklch {
            accent-color: oklch(60% 0.2 250);
        }


        /* ==================================================
       GERÇEK PROJE ÖRNEĞİ
       ==================================================

       Aynı accent-color değeri birden fazla
       form kontrolüne uygulanabilir.
    */

        .form {
            accent-color: #2563eb;
        }


        /* ==================================================
       ÖRNEK FORM
       ================================================== */

        .form-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="range"] {
            width: 250px;
        }
    </style>
</head>


<body>


    <!-- ==================================================
       1. auto
       ================================================== -->

    <h2>1. accent-color: auto</h2>

    <div class="container">

        <input type="checkbox" class="auto" checked>

        <input type="radio" name="auto" class="auto" checked>

    </div>


    <!-- ==================================================
       2. red
       ================================================== -->

    <h2>2. accent-color: red</h2>

    <div class="container">

        <input type="checkbox" class="red" checked>

        <input type="radio" name="red" class="red" checked>

        <input type="range" class="red" value="70">

    </div>


    <!-- ==================================================
       3. blue
       ================================================== -->

    <h2>3. accent-color: blue</h2>

    <div class="container">

        <input type="checkbox" class="blue" checked>

        <input type="radio" name="blue" class="blue" checked>

        <input type="range" class="blue" value="70">

    </div>


    <!-- ==================================================
       4. green
       ================================================== -->

    <h2>4. accent-color: green</h2>

    <div class="container">

        <input type="checkbox" class="green" checked>

        <input type="radio" name="green" class="green" checked>

        <input type="range" class="green" value="70">

    </div>


    <!-- ==================================================
       5. purple
       ================================================== -->

    <h2>5. accent-color: purple</h2>

    <div class="container">

        <input type="checkbox" class="purple" checked>

        <input type="radio" name="purple" class="purple" checked>

        <input type="range" class="purple" value="70">

    </div>


    <!-- ==================================================
       6. HEX
       ================================================== -->

    <h2>6. accent-color: #ff6600</h2>

    <div class="container">

        <input type="checkbox" class="hex" checked>

        <input type="radio" name="hex" class="hex" checked>

        <input type="range" class="hex" value="70">

    </div>


    <!-- ==================================================
       7. RGB
       ================================================== -->

    <h2>7. accent-color: rgb()</h2>

    <div class="container">

        <input type="checkbox" class="rgb" checked>

        <input type="radio" name="rgb" class="rgb" checked>

        <input type="range" class="rgb" value="70">

    </div>


    <!-- ==================================================
       8. RGBA
       ================================================== -->

    <h2>8. accent-color: rgba()</h2>

    <div class="container">

        <input type="checkbox" class="rgba" checked>

        <input type="radio" name="rgba" class="rgba" checked>

        <input type="range" class="rgba" value="70">

    </div>


    <!-- ==================================================
       9. HSL
       ================================================== -->

    <h2>9. accent-color: hsl()</h2>

    <div class="container">

        <input type="checkbox" class="hsl" checked>

        <input type="radio" name="hsl" class="hsl" checked>

        <input type="range" class="hsl" value="70">

    </div>


    <!-- ==================================================
       10. OKLCH
       ================================================== -->

    <h2>10. accent-color: oklch()</h2>

    <div class="container">

        <input type="checkbox" class="oklch" checked>

        <input type="radio" name="oklch" class="oklch" checked>

        <input type="range" class="oklch" value="70">

    </div>


    <!-- ==================================================
       GERÇEK PROJE ÖRNEĞİ
       ================================================== -->

    <h2>Gerçek Proje Örneği</h2>

    <div class="container form">

        <div class="form-area">

            <label>
                <input type="checkbox" checked>
                Bildirimleri aç
            </label>

            <label>
                <input type="radio" name="theme" checked>
                Açık tema
            </label>

            <label>
                <input type="radio" name="theme">
                Koyu tema
            </label>

            <input type="range" min="0" max="100" value="70">

        </div>

    </div>


</body>

</html>
