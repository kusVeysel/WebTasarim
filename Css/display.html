        <button type="submit">Giriş Yap</button>

    </form>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
    }

    .block {
        display: block;
        background: lightblue;
        margin-bottom: 10px;
        width: 200px;
        padding: 15px;
    }

    .inline {
        display: inline;
        background-color: yellow;
        padding: 15px;
    }

    .inline-block {
        display: inline-block;
        background: orange;
        padding: 15px;
        width: 200px;
        margin-right: 10px;
        color: darkgreen;
        font-size: 23px;

    }

    .kapsayıcı {
        display: flex;
        gap: 20px;
    }
</style>

<body>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <div class="block">Block 3</div>

    <hr>
    <div class="inline">İnline 1</div>
    <div class="inline">İnline 2</div>
    <div class="inline">İnline 3</div>

    <hr>
    <br>
    <div class="inline-block">inline-block 1</div>
    <div class="inline-block">inline-block 2</div>
    <div class="inline-block">inline-block 3</div>

    <div class="kapsayıcı">
        <div class="kutu">A</div>
        <div class="kutu">B</div>
        <div class="kutu">C</div>
    </div>
</body>

</html>
