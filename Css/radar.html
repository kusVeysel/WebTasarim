<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .kutu {
        width: 400px;
        height: 400px;
        background: #0B3D2E;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 100%;
    }

    .kutu1 {
        width: 300px;
        height: 300px;
        background: #1F7A5C;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 100%;
    }

    .kutu2 {
        width: 200px;
        height: 200px;
        background: #00FF66;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 100%;
    }

    .kutu3 {
        width: 100px;
        height: 100px;
        background: #66FFCC;
        border-radius: 100%;
    }

    .cubuk {
        height: 400px;
        width: 1px;
        background-color: blue;
        position: absolute;
        animation: al 10s linear infinite;
    }

    .gizli1 {
        height: 200px;
        width: 3px;
    }

    .gizli2 {
        height: 50px;
        width: 3px;
        background-color: #0B3D2E;
    }

    .gizli3 {
        width: 3px;
        height: 50px;
        background-color: #1F7A5C;
    }

    .gizli4 {
        height: 50px;
        width: 3px;
        background-color: #00FF66;
    }

    .gizli5 {
        width: 3px;
        height: 50px;
        background-color: #66FFCC;
    }

    .gizsiz {
        width: 3px;
        height: 200px;
        background-color: red;
        position: absolute;
        bottom: 0;
        box-shadow: 4px 0 3px 4px rgb(235, 77, 77);
        border-radius: 100%;
    }


    @keyframes al {
        0% {
            transform: rotate(0);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<body>

    <div class="kutu">
        <div class="kutu1">
            <div class="kutu2">
                <div class="kutu3">
                </div>
            </div>
        </div>
        <div class="cubuk">
            <div class="gizsiz"></div>
            <div class="gizli1">
                <div class="gizli2"></div>
                <div class="gizli3"></div>
                <div class="gizli4"></div>
                <div class="gizli5"></div>
            </div>

        </div>
    </div>

</body>

</html>
