<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS ÖZET</title>
</head>

<body>
<!--

        ==================================================
                            ÖZET
        ==================================================

?        1. SEÇİCİLER
        --------------------------------------------------
*        #id: Benzersiz bir elementi seçer. CSS'te başına # yazılır.
*        .class: Birden fazla elemente stil vermek için kullanılır. CSS'te başına . yazılır.
*        etiket: div, p, h1 gibi etikete ait tüm elementleri seçer.
*        *: Sayfadaki tüm elementleri seçer.
*        .kapsayici p: .kapsayici içindeki tüm p etiketlerini seçer.
*        .kapsayici > p: Yalnızca .kapsayici'nin doğrudan p çocuklarını seçer.

?        2. BOYUT VE KUTU MODELİ
        --------------------------------------------------
*        width: Elementin genişliğini verir.
*        height: Elementin yüksekliğini verir.
*        min-width: Genişliğin alt sınırını belirler.
*        max-width: Genişliğin üst sınırını belirler.
*        min-height: Yüksekliğin alt sınırını belirler.
*        max-height: Yüksekliğin üst sınırını belirler.
*        box-sizing: border-box değeri, padding ve border'ı genişlik ve yükseklik hesabına dahil eder.
*        margin: Elementin dış boşluğunu verir.
*        padding: Elementin iç boşluğunu verir.

?        3. KENARLIK VE ARKA PLAN
        --------------------------------------------------
*        border: Kenarlık verir.
*        → syntax: border: kalınlık kenar_tipi kenarlık_rengi;
*        border-radius: Köşeleri yuvarlatır.
*        outline: Border'ın dışında, yer kaplamayan bir kenarlık oluşturur.
*        outline-offset: Outline'ın elementten uzaklığını belirler.
*        background-color: Arka plan rengini verir.
*        background: Arka planla ilgili özellikleri kısa yoldan tanımlar.
*        background-image: Arka plan görselini belirler.
*        → syntax: background-image: url("")
*        background-size: Arka plan görselinin boyutunu belirler.
*        → syntax: background-size: x_ekseninde_boyutu y_ekseninde_boyutu
*        background-position: Arka plan görselinin konumunu belirler.
*        → syntax: background-position: x_ekseninde_konumu y_ekseninde_konumu
*        background-repeat: Arka plan görselinin tekrar durumunu belirler.

?        4. METİN VE YAZI TİPİ
        --------------------------------------------------
*        color: Yazı rengini verir.
*        text-align: Metnin yatay hizasını belirler.
*        text-decoration: Metin çizgisini belirler.
*        text-transform: Metnin harf dönüşümünü belirler.
*        line-height: Satır yüksekliğini belirler.
*        letter-spacing: Harfler arasındaki boşluğu belirler.
*        font-family: Yazı tipini belirler.
*        font-size: Yazı büyüklüğünü belirler.
*        font-weight: Yazı kalınlığını belirler.

?        5. KONUM VE TAŞMA
        --------------------------------------------------
*        position: Elementin konumlandırma yöntemini belirler.
*        → static: Varsayılan konumdur; top, right, bottom ve left etkisizdir.
*        → relative: Normal yerini korur; kendi konumuna göre kaydırılabilir.
*        → absolute: En yakın position verilmiş üst elemente göre konumlanır.
*        → fixed: Ekrana göre sabitlenir; sayfa kaydırılsa da yerinde kalır.
*        → sticky: Belirlenen noktaya kadar normal davranır, sonra yapışkan olur.
*        top: Elementin üst kenarına göre konumunu ayarlar.
*        right: Elementin sağ kenarına göre konumunu ayarlar.
*        bottom: Elementin alt kenarına göre konumunu ayarlar.
*        left: Elementin sol kenarına göre konumunu ayarlar.
*        z-index: Üst üste gelen konumlandırılmış elementlerin katman sırasını belirler.
*        overflow: Taşan içeriğin görünme, gizlenme veya kaydırılma yöntemini belirler.

?        6. GÖRÜNÜRLÜK VE ETKİLEŞİM
        --------------------------------------------------
*        display: Elementin sayfadaki davranışını ve çocuklarının düzenini belirler.
*        → block: Yeni satırdan başlar, kullanılabilir genişliği kaplar.
*        → inline: Yan yana dizilir; genişlik ve yükseklik doğrudan uygulanmaz.
*        → inline-block: Yan yana dizilir; genişlik ve yükseklik alabilir.
*        → none: Elementi sayfada gizler ve yer kaplamamasını sağlar.
*        opacity: Saydamlık oranını belirler. 0 tamamen saydam, 1 tamamen görünürdür.
*        visibility: Elementin görünürlüğünü belirler.
*        cursor: Farenin element üzerindeki işaretçi şeklini belirler.

?        7. FLEXBOX
        --------------------------------------------------
*        display: flex; Çocuk elementleri esnek kutu düzenine alır.
*        flex-direction: Ana ekseni belirler. row yatay, column dikey sıralar.
*        flex-wrap: Elemanların sığmadığında alt satıra geçme durumunu belirler.
*        justify-content: Ana eksende hizalama yapar.
*        align-items: Çapraz eksende hizalama yapar.
*        align-content: Birden fazla satır oluştuğunda satırların çapraz eksendeki hizasını ayarlar.
*        gap: Flex elemanları arasındaki boşluğu belirler.
*        flex: Bir elemanın büyüme, küçülme ve başlangıç boyutunu kısa yoldan belirler.
*        order: Flex elemanlarının sırasını değiştirir.

?        8. GRID
        --------------------------------------------------
*        display: grid; Çocuk elementleri satır ve sütunlardan oluşan iki boyutlu düzene alır.
*        grid-template-columns: Sütunların sayısını ve boyutlarını belirler.
*        grid-template-rows: Satırların sayısını ve boyutlarını belirler.
*        grid-column: Bir elemanın kaplayacağı sütunu belirler.
*        grid-row: Bir elemanın kaplayacağı satırı belirler.
*        gap: Grid satırları ve sütunları arasındaki boşluğu belirler.
*        justify-items: Grid elemanlarını hücreleri içinde yatay hizalar.
*        align-items: Grid elemanlarını hücreleri içinde dikey hizalar.

?        9. GEÇİŞ VE ANİMASYON
        --------------------------------------------------
*        transition: Bir CSS özelliğindeki değişimin yumuşak geçişini sağlar.
*        → syntax: transition: özellik süre zamanlama_fonksiyonu gecikme;
*        animation: @keyframes ile tanımlanan animasyonu uygular.
*        → syntax: animation: name duration timing-function delay iteration-count direction fill-mode play-state;
*        transform: Elementi taşıma, döndürme, ölçekleme veya eğme işlemlerinde kullanılır.
*        filter: Bulanıklık, parlaklık ve benzeri görsel efektler uygular.
    
-->
</body>

</html>
