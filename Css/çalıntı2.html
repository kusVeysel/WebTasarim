<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Korkutucu Gözler</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.eyes {
    display: flex;
    gap: 50px;
}

.eye {
    width: 110px;
    height: 110px;
    background: #111;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
}

.eye::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #333 30%, #000 70%);
}

.pupil {
    width: 32px;
    height: 32px;
    background: red;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px red, 0 0 30px darkred;
    transition: transform 0.05s linear;
}

/* Göz kapağı */
.lid {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    top: -100%;
    left: 0;
    animation: blink 5s infinite;
}
@keyframes blink {
    0%, 92%, 100% { top: -100%; }
    94%, 96% { top: 0; }
}
</style>
</head>
<body>

<div class="eyes">
    <div class="eye">
        <div class="pupil"></div>
        <div class="lid"></div>
    </div>
    <div class="eye">
        <div class="pupil"></div>
        <div class="lid"></div>
    </div>
</div>

<script>
document.addEventListener("mousemove", (e) => {
    document.querySelectorAll(".pupil").forEach(pupil => {
        const eye = pupil.parentElement;
        const rect = eye.getBoundingClientRect();

        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
        const max = 25;

        const x = Math.cos(angle) * max;
        const y = Math.sin(angle) * max;

        pupil.style.transform =
            `translate(-50%, -50%) translate(${x}px, ${y}px)`;
    });
});
</script>

</body>
</html>
