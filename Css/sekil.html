<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        width: 100px;
        height: 100px;
        background: red;
        clip-path: path("M10 80 Q 95 10 180 80 T 330 80");
    }

    .box2 {
        width: 100px;
        height: 100px;
        background: orange;
        clip-path: polygon(50% 0, 65% 30%, 100% 30%, 73% 55%, 86% 90%,
                50% 70%,
                14% 90%, 27% 55%, 0% 30%, 35% 30%);
    }

    .box3 {
        width: 100px;
        height: 100px;
        background: darkblue;
        clip-path: path("M0 0 L100 0 L100 80 C 80 100 30 100 0 80 Z");
    }

    .box4 {
        width: 100px;
        height: 100px;
        background: darkgreen;
        clip-path: path("M50 0 Q 100 0 100 50 Q100 100 50 100 Q0 100 0 50 Q0 0 50 0");
    }

    .box5 {
        width: 100px;
        height: 100px;
        background: transparent;
        border: 5px solid red;
        border-radius: 50%;


    }
</style>

<body>
    <div class="box"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
</body>

</html>
