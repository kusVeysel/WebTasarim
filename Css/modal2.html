<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
}
.panel{
    position: fixed;
    top: 0;
    right: -300px;
    width: 300px;
    height: 100%;
    background:#222 ;
    color: white;
    padding: 20px;
    transition: 2s;
    }

.overlay{
    position: fixed;
    inset:0 ; /*4 tarafı 0 yap*/
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: 2s;
}
#toggle:checked ~.panel{
    right: 0;
}
#toggle:checked ~ .overlay{
    opacity: 1;
    pointer-events:none;
}
#toggle{
    display: none;
}
.kapat {
    position: relative;
    top: 950px;
    padding-left:120px ;
}

</style>
<body>
    
    <input type="checkbox" id="toggle">
    <label for="toggle" class="open">Menü Aç/Kapat</label>


    <div class="overlay"></div>
    <div class="panel">
        <h1>Yan Menü</h1>
            <p>Burası Kayarak Gelen Panel</p>
            <label for="toggle" class="kapat">menüyü kapat</label>
    </div>
</body>
</html>
