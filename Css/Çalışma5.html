<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .kutu{
        cursor:grab;
    }
    .kutu:active{
        cursor: grabbing;
    }
.kutu{
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 100%;
    width: 150px;
    height: 150px;
    background-color: red;
    
}
.çubuk{
    position: relative;
  border-radius: 100%;
animation: hareket 60s linear infinite;
    background-color: black;
    width: 1px;
    height: 150px;
}
.rahat{
   position: absolute;
   bottom: 0;
    background-color: red;
        width: 1px;
    height: 75px;
}
.akrep{
    position: relative;
    border-radius: 100%;
    animation: hareket 86400s linear infinite;
    background-color: aqua;
    width: 1px;
    height: 90px;
    opacity: 10;
}
.rahat2{
    position: absolute;
    bottom: 0;
    background-color: red;
    width: 1px;
    height: 45px;
}
.dakka{
    animation: hareket 3600s linear infinite;
    border-radius: 100%;
    position: relative;
    background-color: blue;
    width: 1px;
    height: 120px;
}
.rahat3{
    position: absolute;
    bottom: 0;
    background-color: red;
    width: 1px;
    height: 60px;
}
@keyframes hareket{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
    
}




</style>
<body>
    
<div class="kutu">
    <div class="çubuk">
        <div class="rahat"></div>
    </div>
     <div class="akrep">
        <div class="rahat2"></div>
     </div>
     <div class="dakka">
        <div class="rahat3"></div>
     </div>
</div>


</body>
</html>
