<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .relative {
        position: relative;
        /*esnek*/
        width: 100px;
        height: 100px;
        background: aqua;
    }

    .absolute {
        position: absolute;
        /*static olmayan üst kutuya(içinde olduğu kutuya) bağlı olur,kutunun içinde istediğimiz tarafa yönlendirebiliriz */
        right: 0;
        width: 50px;
        height: 50px;
        background: red;
    }

    .fixed {
        position: fixed;
        /*ekrana yapışşır,sabitlenir*/
        width: 100px;
        height: 100px;
        background: black;
    }

    .static {
        position: static;
        /*top,bottom,right,left uygulanmaz*/
        width: 100px;
        height: 100px;
        background: pink;
    }
</style>

<body>

    <div class="relative">
        <div class="absolute"></div>
    </div>

    <div class="fixed"></div>
    <div class="static"></div>
    <br> <br>

</body>

</html>
<!-- 
position:

static --dokunma
relative -- kafana göre
absolute -- parente göre hizalan
fixed -- ekrana yapış

-->
