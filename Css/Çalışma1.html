<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    font-family: Arial, Helvetica, sans-serif;
    background:linear-gradient(92deg,pink,rgb(173, 27, 27),rgb(185, 33, 185));
    margin: 0;
    overflow: hidden; /* kutuyu taşan kısmı görünmez yapar*/
  }
.ana{
    display: flex;
    align-items: center;
    height: 100vh;
    justify-content: space-between;
}
.evet{
    background: rgb(92, 92, 163);
    padding: 20px;
    font-size: 30px;
    width: 150px;
    border-radius: 17px;
    text-align: center;
}
.hayır{
    background: rgb(92, 92, 163);
    padding: 20px;
    font-size: 30px;
    width: 150px;
    border-radius: 17px;
    text-align: center;
}
.hayır .b{
    display: none;
}
.hayır:hover .a{
    display: none;
}
.hayır:hover .b{
    display: inline;
}
.soru{
    background:linear-gradient(120deg,pink,darkblue);
    padding: 20px;
    font-size: 30px;
    width: 150px;
    border: 3px solid gray;
}
.kapla{
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: 8s;
    background-image: url("https://cdn.listelist.com/wp-content/uploads/2017/07/gulen-adam-11-e1499175361665-620x375.jpg");
    background-size: 100% 100%; 
    display: flex;
    justify-content: center;
    align-items: center;
}
.kapla div{
    color: red;
    display: flex;
    text-align: center;
    position: relative;
    font-size: 50px;
}
#bilmek:checked ~.kapla {
    opacity: 1;
    pointer-events: auto;
}
#bilmek{
    display: none;
}



</style>
<body>
   
    <input type="checkbox" id="bilmek">
        <div class="kapla">
            <div>BİLİYORDUM</div>
        </div>

    <div class="ana">
        <label for="bilmek" class="evet">evet</label>
        <div class="soru">GAY Mısın?</div>
        <span class="hayır" for="bilmek">
            <label for="bilmek" class="a"><span>hayır</span></label>
            <label for="bilmek" class="b"><span>evet</span></label>
        </span>   
    </div>

</body>
</html>
