<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>C TAGLARI</title>
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <canvas id="ornekCanvas" width="200" height="100" style="border:1px solid #000;"></canvas>
    <!-- canvas tagı, JavaScript ile 2d 3d çizim yapmak için kullanılır -->    
    <br> <br>
    
    <!--  KULLANIŞSIZ TAGLAR  -->
      
    <table border="1">
        <caption>Aylık Gelir Tablosu</caption>
        <!-- caption tagı tablo başlığı için kullanılır -->
        <colgroup>
            <col style="background-color: yellow;" span="2">
        </colgroup>
        <!-- colgroup tagı, tablo sütunlarını gruplamak ve stil vermek için kullanılır 
        col tagı, colgroup içinde kullanılır ve her bir sütuna stil vermek için kullanılır 
        span attribute, col tagının kaç sütunu kapsayacağını belirtir
        --> 
        <tr>
            <th>Ay</th>
            <th>Miktar</th>
        </tr>
        <tr>
            <td>Ocak</td>
            <td>5000 TL</td>
        </tr>
    </table>
    <br> <br>

    <cite>Nutuk</cite>, Mustafa Kemal Atatürk tarafından kaleme alınmıştır.
    <!-- cite tagı, bir eserin adını belirtmek için kullanılır -->
    <br> <br>

    Ekrana yazı yazdırmak için <code>console.log()</code> fonksiyonu kullanılır.
    <!-- code tagı, bilgisayar kodunu belirtmek için kullanılır -->

</body>
</html>
