<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="https://www.ornek.com/blog/">
    <!--base tagı tüm linkler için temel URL belirler-->
    <title>B TAGLARI</title>
</head>
<body>
<!--body tagı sayfa içeriği için kullanılır-->    

    <!--  KULLANIŞLI TAGLAR  -->
    
    <b>b tagı</b>
    <!-- b tagı kalın yazı için kullanılır -->

    <br> br tagı
    <!-- br tagı alta geçmek için kullanılır -->
    <br> <br>

    <button type="">button tagı</button>
    <!-- button tagı buton oluşturmak için kullanılır
    type="" kısmına submit, reset, button gibi değerler verilebilir 
    submit = formu gönderir, reset = formu sıfırlar, button = buton oluşturur -->
    <br> <br>

    <a href="hakkimizda.html">Hakkımızda</a>
    <a href="iletisim.html">İletişim</a>
    <a href="galeri.html">Galeri</a>
    <br> <br>

    <!--  KULLANIŞSIZ TAGLAR  -->

    Kullanıcı <bdi>User123</bdi>: 5 puan <br>
    Kullanıcı <bdi>عربي</bdi>: 9 puan
    <!-- bdi tagı metin yönünü izole etmek için kullanılır -->
    <br> <br>

    <bdo dir="rtl">Bu metin sağdan sola doğru yazılacak</bdo>
    <!-- bdo tagı metin yönünü değiştirmek için kullanılır
    dir="rtl" sağdan sola, dir="ltr" soldan sağa yönlendirme yapar --> 
    <br> <br>

    <blockquote>Bu bir alıntıdır.</blockquote>
    <!--blockquote tagı alıntılar için kullanılır-->

</body>
</html>
