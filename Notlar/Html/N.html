<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>N Harfi Etiketleri</title>
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <nav>
        <a href="/anasayfa">Anasayfa</a> | 
        <a href="/hakkimizda">Hakkımızda</a> | 
        <a href="/iletisim">İletişim</a>
    </nav>
    <!-- nav tagı: Web sitesi içindeki ana dolaşım/navigasyon linklerini (menüleri) barındıran semantik bir kapsayıcıdır. -->
    <br><br>

    <!--  KULLANIŞSIZ TAGLAR  -->

    <noscript>
        <p>Tarayıcınızda JavaScript kapalı olduğu için bu site düzgün çalışmayabilir.</p>
    </noscript>
    <!-- noscript tagı: Kullanıcının tarayıcısında JavaScript desteği kapalıysa veya hiç yoksa ekranda gösterilecek alternatif içerikleri barındırır. -->
    
</body>
</html>
