<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>R ve S Harfi Etiketleri</title>
</head>
<body>

    <!--  KULLANIŞSIZ TAGLAR  -->

    <ruby>漢 <rb>字</rb> <rt>かんじ</rt></ruby>
    <!-- rb tagı: Asya dillerindeki karakterlerin telaffuzunu göstermek için kullanılan <ruby> yapısı içinde, açıklama yapılacak temel metni/karakteri (base text) açıkça tanımlar. -->
    <br><br>


    <ruby>漢 <rp>(</rp><rt>Kan</rt><rp>)</rp></ruby>
    <!-- rp tagı: Ruby açıklamasını desteklemeyen eski tarayıcılarda, <rt> içindeki okunuş metninin parantez içinde gösterilmesini sağlayan alternatif bir etiketidir. -->
    <br><br>


    <ruby>漢 <rt>Kan</rt></ruby>
    <!-- rt tagı: Ruby yapısı içindeki temel karakterin hemen üstünde veya yanında görünecek olan okunuş/telaffuz açıklamasını (tipografik notu) tanımlar. -->
    <br><br>


    <!-- rtc tagı: Ruby yapısı içinde, karakterlerin ikinci bir seviyede veya farklı bir dilde anlamsal açıklamasını topluca gruplamak için eskiden kullanılan anlamsal bir kapsayıcıdır. -->
    <br><br>


    <ruby>明 <rt>mei</rt></ruby>
    <!-- ruby tagı: Özellikle Doğu Asya (Japonca, Çince vb.) karakterlerinin üzerine küçük harflerle okunuş, telaffuz veya anlam kılavuzu eklemek için kullanılan ana kök etikettir. -->

</body>
</html>
