<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>P Harfi Etiketleri</title>
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <p>Bu bir paragraf metnidir.</p>
    <!-- p tagı: Sayfada düz metin blokları oluşturmak için kullanılan temel paragraf etiketidir. Tarayıcılar otomatik olarak alt ve üstüne boşluk bırakır. -->
    <br><br>

    Yükleniyor: <progress value="70" max="100">70%</progress>
    <!-- progress tagı: Bir görevin veya işleminin (dosya indirme, form doldurma süreci vb.) tamamlanma durumunu/ilerlemesini gösteren görsel bir çubuk oluşturur. -->
    <br> <br>

    <!--  KULLANIŞSIZ TAGLAR  -->

    <pre>
        Burası   boşlukları   ve
        alt satırları
        aynen korur.
    </pre>
    <!-- pre tagı: Önceden biçimlendirilmiş (preformatted) metinleri göstermek için kullanılır. Kodun içindeki tüm boşlukları, tab'ları ve satır başlarını tarayıcı ekranına aynen yansıtır. -->
    <br><br>

    <picture>
        <source media="(min-width: 650px)" srcset="resim.jpeg">
        <img src="resim.jpeg" alt="Esnek Resim">
    </picture>
    <!-- picture tagı: Farklı ekran boyutlarına (mobil, tablet, masaüstü) veya cihaz çözünürlüklerine göre farklı görsel dosyaları sunabilen esnek bir resim kapsayıcısıdır. -->
    <br><br>

</body>
</html>
