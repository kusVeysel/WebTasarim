<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>I ve İ Harfi Etiketleri</title>
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <input type="text" placeholder="Adınızı giriniz" name="">
    <!-- input tagı: Kullanıcının veri girişi yapabileceği (yazı, şifre, dosya, buton vb.) etkileşimli form alanları oluşturur. Kapanış etiketi yoktur. -->
    <br><br>

    <img src="resim.jpeg" alt="Açıklama Metni" width="200" height="200">
    <!-- img tagı: Sayfaya resim veya görsel eklemek için kullanılır. Kapanış etiketi yoktur. -->
    <br><br>

    <!--  KULLANIŞSIZ TAGLAR  -->

    <i>i etiketi</i>>
    <!-- i tagı: İçindeki metni teknik bir terim, düşünce veya farklı bir dildeki kelime olarak ayırıp ekranda eğik (italic) gösterir. -->
    <br><br>

    <iframe src="https://www.wikipedia.org" width="500" height="300"></iframe>
    <!-- iframe tagı: Mevcut web sayfasının içine başka bir web sitesini veya harici bir içeriği (örneğin YouTube videosu) gömmek için bir pencere açar. -->
    <br><br>

    <ins>ins etiketi</ins>
    <!-- ins tagı: Dokümana sonradan eklenen metinleri belirtir. Tarayıcılar genellikle bu metnin altını çizerek gösterir. -->
    <br><br>

</body>
</html>
