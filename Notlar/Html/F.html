<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>F Harfi Etiketleri</title>
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <footer>
        <p>© 2026 Tüm Hakları Saklıdır.</p>
    </footer>
    <!-- footer tagı: Bir sayfanın veya bir bölümün en alt kısmını (telif hakkı, iletişim linkleri vb.) tanımlar. -->
    <br><br>
    
    <form action="" method="post">
        <input type="text" name="isim">
        <button type="submit">Gönder</button>
    </form>
    <!-- form tagı: Kullanıcıdan bilgi toplamak (giriş yapmak, kayıt olmak vb.) ve bu bilgileri sunucuya göndermek için alanlar oluşturur. -->
    <br><br>

    <!--  KULLANIŞSIZ TAGLAR  -->
    
    <form>
        <fieldset>
            <legend>Giriş Bilgileri</legend>
            <input type="text" placeholder="Kullanıcı Adı">
        </fieldset>
    </form>
    <!-- fieldset tagı: Form içindeki ilişkili öğeleri (girdileri, butonları) bir kutu içine alarak gruplar. -->
    <br><br>

    <figure>
        <img src="resim.jpeg" alt="Doğa">
        <figcaption>Şekil 1: Manzara Görseli</figcaption>
    </figure>
    <!-- 
    figcaption tagı: figure etiketiyle eklenen resim, grafik veya tablolar için bir alt yazı/açıklama başlığı tanımlar,
    figure tagı: Resim, diyagram, fotoğraf veya kod parçacıkları gibi ana metinden bağımsız olabilen görsel içerikleri gruplamak için kullanılır. 
    -->

</body>
</html>
