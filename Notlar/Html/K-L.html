<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>K ve L Harfi Etiketleri</title>
    <link rel="stylesheet" href="#">
    <!--link etiketi link vermeye yarar,kalıtım alır -->
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <label for="">E-posta</label>
    <input type="email">
    <!-- label tagı: Bir form elemanı (input vb.) için açıklama metni tanımlar. -->
    <br><br>
    
    <ul>
        <li value="1">İlk Madde</li>
        <li value="2">İkinci Madde</li>
    </ul>
    <!-- li tagı: Sıralı (ol) veya sırasız (ul) listelerin içindeki her bir maddeyi/ögeyi tanımlar. -->
    <br> <br>
    
    <!--  KULLANIŞSIZ TAGLAR  -->

    Ekran görüntüsü almak için <kbd>Ctrl</kbd> + <kbd>PrntScrn</kbd> tuşlarına basın.
    <!-- kbd tagı: Kullanıcıya klavyeden basması gereken tuşları, sesli komutları veya bilgisayar girişlerini göstermek için kullanılır. Tarayıcılar içindeki yazıyı genellikle monospace (kodlama) yazı tipinde gösterir. -->
    <br> <br>

    <fieldset>
        <legend>Kişisel Bilgiler</legend>
        <input type="text" placeholder="Adınız">
    </fieldset>
    <!-- legend tagı: fieldset etiketiyle oluşturulan grubun başlığını/adını tanımlar. -->
    <br><br>

</body>
</html>
