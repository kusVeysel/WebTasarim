<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>O Harfi Etiketleri</title>
</head>
<body>        
      
    <!--  KULLANIŞLI TAGLAR  -->
    
    <ol>
        <li>Birinci Adım</li>
        <li>İkinci Adım</li>
    </ol>
    <!-- ol tagı: Sıralı (numaralandırılmış) bir liste oluşturur. Maddelerin başına otomatik olarak sayı, harf veya Roma rakamı ekler. -->
    <br><br>
    
    
    <select>
        <optgroup label="Meyveler">
            <option>Elma</option>
            <option>Muz</option>
        </optgroup>
        <optgroup label="Sebzeler">
            <option value="">Patlıcan</option>
            <option value="">Domates</option>
        </optgroup>
    </select>
    <!-- optgroup tagı: Açılır listeler (<select>) içindeki seçenekleri (<option>) anlamsal olarak gruplara ayırıp başlıklandırmak için kullanılır. -->
        <br><br>
        
        
    <select>
        <option>Seçenek 1</option>
        <option>Seçenek 2</option>
    </select>
    <!-- option tagı: Açılır liste (<select>) veya veri listesi (<datalist>) içindeki seçilebilir her bir ögeyi tanımlar. -->
        <br><br>
        
    <!--  KULLANIŞSIZ TAGLAR  -->
        
    <form oninput="x.value=parseInt(a.value)+parseInt(b.value)">
        <input type="number" id="a" value="10"> +
        <input type="number" id="b" value="20"> =
        <output name="x" for="a b">30</output>
    </form>
    <!-- output tagı: Genellikle bir script veya form hesaplamasının (matematiksel işlem vb.) sonucunu ekranda göstermek için kullanılır. -->
    
    <object data="belge.pdf" type="application/pdf" width="400" height="300"></object>
    <!-- object tagı: Sayfaya harici bir multimedya, eklenti, PDF dökümanı, resim veya başka bir HTML sayfası gömmek için kullanılan çok amaçlı bir dış kaynak konteyneridir. -->
    <br><br>

</body>
</html>
