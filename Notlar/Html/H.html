<!DOCTYPE html>
<html lang="tr">
<!-- html tagı: Bir HTML dokümanının kök (root) elemanıdır; yazılan tüm diğer HTML kodları bu etiketin içine yerleştirilir. -->
<head>
<!-- head tagı: Web sayfasıyla ilgili arka plan bilgilerini (meta veriler, başlık, CSS linkleri) barındıran görünmez kapsayıcıdır. -->
    <meta charset="UTF-8">
    <title>H Harfi Etiketleri</title>
</head>
<body>

    <!--  KULLANIŞLI TAGLAR  -->

    <header>
        <h1>Site Logosu</h1>
        <nav>Menü Linkleri</nav>
    </header>
    <!-- header tagı: Bir sayfanın veya bir bölümün giriş/girişgah kısmını (logo, arama çubuğu, ana menü) temsil eden semantik kutudur. -->
    <br><br>

    <h1>Başlık h1</h1>
    <h2>Başlık h2</h2>
    <h3>Başlık h3</h3>
    <h4>Başlık h4</h4>
    <h5>Başlık h5</h5>
    <h6>Başlık h6</h6>
    <!-- h1-h6 tagları: Sayfadaki başlıkları hiyerarşik olarak tanımlar. h1 en büyük ve en önemli, h6 ise en küçük başlıktır. -->
    <br><br>

    <hr> hr tagı
    <!-- hr tagı: Sayfaya yatay bir çizgi çekerek konuları veya bölümleri görsel olarak birbirinden ayırır. Kapanış etiketi yoktur. -->
    <br> <br>
    <!--  KULLANIŞSIZ TAGLAR  -->

    <hgroup>
        <h1>Ana Başlık</h1>
        <p>Başlığın hemen altındaki açıklama veya alt başlık metni.</p>
    </hgroup>
    <!-- hgroup tagı: Bir başlığı ve onunla ilişkili alt başlıkları veya açıklamaları tek bir grup altında toplamak için kullanılır. -->
    <br><br>

</body>
</html>
