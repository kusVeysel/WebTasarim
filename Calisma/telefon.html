#ana{
width: 200px;
height: 35px;
background:rgb(230, 229, 229);
position: relative;
border-radius: 5px;
cursor: pointer;
}
#ana:hover{
    background-color: rgb(179, 179, 179);
}
#ucgen{
width: 30px;
height: 30px;
background-image:url(https://upload.wikimedia.org/wikipedia/commons/3/3c/Black_triangle.svg) ;
background-size:50% 30%;
background-repeat: no-repeat;
position: absolute;
right: -9px;
top: 15px;
}
#gizli1{
    display: none;
    
}
#tr{
    width: 200px;
    height: 35px;
    border: 0.5px solid red;
    background-color: rgb(155, 32, 32);
    border-radius: 2px;
    position: relative;
    opacity: 0.0;
    cursor: pointer;
    color: aliceblue;
}
#tr:hover{
    box-shadow: 0 0 5px red;
}
#fr{
    width: 200px;
    height: 35px;
    border: 0.5px solid darkblue;
    background-color: rgb(17, 17, 133);
    border-radius: 2px;
    position: relative;
    opacity: 0.0;
    cursor: pointer;
    color: aliceblue;
}
#fr:hover{
    box-shadow: 0 0 5px darkblue;
}
#du{
    width: 200px;
    height: 35px;
    border: 0.5px solid yellow;
    background-color: rgb(184, 184, 22);
    opacity: 0.5;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    opacity: 0.0;
    color: aliceblue;
}
#du:hover{
    box-shadow: 0 0 5px yellow;
}
::placeholder{
    color: whitesmoke;
}
#kapsa{
    display: block;
}
