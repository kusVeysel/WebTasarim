<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(120deg, #3498db, #8e44ad);
        height: 100px;
        justify-content: center;
        /*yatayda ortalama*/
        align-items: center;
        /*dikeyde ortalama*/
        display: flex;
        height: 100vh;
    }

    .login-box {
        background-color: white;
        padding: 40px;
        border-radius: 10px;
        width: 300px;
        text-align: center;
        box-shadow: 0 0 20px rgb(0, 0, 0, 3);
    }

    .login-box h2 {
        margin-bottom: 20px;
    }

    .login-box input {
        width: 100px;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .login-box button:hover {
        background-color: #2a6892;
    }
</style>

<body>

    <div class="container">
        <div class="login-box">
            <h2>Giriş Yap</h2>
            <form>
                <input type="email" placeholder="eposta" required>
                <input type="password" placeholder="Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>
        </div>
    </div>
</body>

</html>
