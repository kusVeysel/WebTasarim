<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #cubuk {
            width: 100px;
            height: 5px;
            background: linear-gradient(to left,blue 50%, transparent 50%);
            /* background: blue; */
            animation: don 2s infinite linear;
        }
        @keyframes don{
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="cubuk"></div>

</body>

</html>
