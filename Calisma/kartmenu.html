<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Site</title>

<link href="../CDN/BootstrapCDN.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    transition:0.3s;
}

/* LIGHT MODE */
body.light{
    background:#f1f5f9;
    color:black;
}

/* NAVBAR */
.navbar{
    transition:0.3s;
}
.navbar.scrolled{
    background:#020617 !important;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

/* HERO */
.hero{
    height:100vh;
}

/* BUTTON */
.main-btn{
    transition:0.3s;
}
.main-btn:hover{
    transform:scale(1.1);
}

/* CARD */
.card{
    background:#1e293b;
    border:none;
    border-radius:15px;
    transform:translateY(60px);
    opacity:0;
    transition:0.6s;
}
body.light .card{
    background:white;
}

.card.show{
    transform:translateY(0);
    opacity:1;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* FOOTER */
footer{
    background:#020617;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-3 fixed-top">
    <a class="navbar-brand" href="#">Site</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
            <li><a class="nav-link" href="#">Ana Sayfa</a></li>
            <li><a class="nav-link" href="#">Hakkımızda</a></li>
            <li><a class="nav-link" href="#">İletişim</a></li>
        </ul>

        <!-- DARK MODE BUTTON -->
        <button id="modeBtn" class="btn btn-outline-light ms-3">☀️</button>
    </div>
</nav>

<!-- HERO -->
<div class="hero d-flex justify-content-center align-items-center text-center">
    <div>
        <h1 class="display-3 text-light">Hoş Geldin</h1>
        <button class="btn btn-primary main-btn mt-4" data-bs-toggle="modal" data-bs-target="#modal">
            Giriş Yap
        </button>
    </div>
</div>

<!-- CARDS -->
<div class="container py-5">
    <div class="row g-4">

        <div class="col-md-6 col-lg-3"><div class="card p-3"><h5>Kart 1</h5><button class="btn btn-outline-info mt-3">Detay</button></div></div>
        <div class="col-md-6 col-lg-3"><div class="card p-3"><h5>Kart 2</h5><button class="btn btn-outline-info mt-3">Detay</button></div></div>
        <div class="col-md-6 col-lg-3"><div class="card p-3"><h5>Kart 3</h5><button class="btn btn-outline-info mt-3">Detay</button></div></div>
        <div class="col-md-6 col-lg-3"><div class="card p-3"><h5>Kart 4</h5><button class="btn btn-outline-info mt-3">Detay</button></div></div>

    </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modal">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light">

            <div class="modal-header">
                <h5>Giriş</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input class="form-control mb-3" placeholder="Kullanıcı adı">
                <input type="password" class="form-control mb-3" placeholder="Şifre">
                <button class="btn btn-success w-100">Giriş</button>
            </div>

        </div>
    </div>
</div>

<footer class="text-center text-light py-3">Alt Bölüm</footer>

<script src="../CDN/BootstrapCDN.js"></script>

<script>
// NAVBAR SCROLL EFFECT
window.addEventListener("scroll", () => {
    const nav = document.querySelector(".navbar");
    nav.classList.toggle("scrolled", window.scrollY > 50);
});

// SCROLL ANIMATION (STAGGER)
const cards = document.querySelectorAll(".card");

const observer = new IntersectionObserver(entries => {
    entries.forEach((entry,index) => {
        if(entry.isIntersecting){
            setTimeout(() => {
                entry.target.classList.add("show");
            }, index * 150);
        }
    });
}, { threshold: 0.2 });

cards.forEach(card => observer.observe(card));

// DARK MODE
const btn = document.getElementById("modeBtn");

btn.addEventListener("click", () => {
    document.body.classList.toggle("light");

    btn.textContent = document.body.classList.contains("light") ? "🌙" : "☀️";
});
</script>

</body>
</html>
<!-- 
IntersectionObserver: gözlemci

-->
